<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0c0c0c;
    color: #fff;
}

/* 下拉提示 */
#pullHint {
    text-align: center;
    font-size: 14px;
    color: #aaa;
    padding: 10px;
}

.header {
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

.card {
    background: #1c1c1e;
    margin: 12px;
    padding: 16px;
    border-radius: 16px;
}

.price {
    color: #aaa;
    margin-bottom: 10px;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    background: #2c2c2e;
    color: white;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.big-number {
    font-size: 34px;
    font-weight: bold;
}

.label {
    color: #aaa;
    margin-top: 10px;
}

canvas {
    margin: 10px;
}
</style>
</head>

<body>

<div id="pullHint">⬇ 下拉重新整理</div>

<div class="header">⛽ 加油紀錄</div>

<div class="card">
    <div class="price">油價（中油95）：31.2 元/L</div>

    <!-- 數字鍵盤版本 -->
    <input id="amount" placeholder="輸入金額" type="text" inputmode="decimal">
    <input id="mileage" placeholder="輸入里程" type="text" inputmode="numeric">

    <button onclick="saveData()">儲存</button>
</div>

<div class="card">
    <div class="label">行駛距離</div>
    <div class="big-number" id="distance">0 km</div>

    <div class="label">平均油耗</div>
    <div class="big-number" id="efficiency">- km/L</div>
</div>

<canvas id="chart"></canvas>

<script>
const price = 31.2;

let lastMileage = localStorage.getItem("lastMileage");
if (lastMileage !== null) {
    lastMileage = parseFloat(lastMileage);
    document.getElementById("mileage").value = lastMileage;
}

let records = JSON.parse(localStorage.getItem("records") || "[]");

const ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: records.map((r,i)=>`第${i+1}次`),
        datasets: [{
            label: 'km/L',
            data: records,
        }]
    }
});

function saveData() {
    const amount = parseFloat(document.getElementById("amount").value);
    const mileage = parseFloat(document.getElementById("mileage").value);

    if (!amount || !mileage) return;

    if (lastMileage !== null) {
        const distance = mileage - lastMileage;
        const fuel = amount / price;
        const efficiency = distance / fuel;

        document.getElementById("distance").innerText = distance + " km";
        document.getElementById("efficiency").innerText = efficiency.toFixed(2) + " km/L";

        records.push(efficiency.toFixed(2));
        localStorage.setItem("records", JSON.stringify(records));
        updateChart();
    }

    localStorage.setItem("lastMileage", mileage);
    lastMileage = mileage;

    document.getElementById("amount").value = "";
}

function updateChart() {
    chart.data.labels = records.map((r,i)=>`第${i+1}次`);
    chart.data.datasets[0].data = records;
    chart.update();
}

/* =========================
   下拉重整（手機用）
========================= */

let startY = 0;
let pulling = false;

document.addEventListener("touchstart", (e) => {
    if (window.scrollY === 0) {
        startY = e.touches[0].clientY;
        pulling = true;
    }
});

document.addEventListener("touchmove", (e) => {
    if (!pulling) return;

    let currentY = e.touches[0].clientY;
    let diff = currentY - startY;

    if (diff > 80) {
        document.getElementById("pullHint").innerText = "放開以重新整理";
    }
});

document.addEventListener("touchend", (e) => {
    if (!pulling) return;

    let endY = e.changedTouches[0].clientY;
    let diff = endY - startY;

    if (diff > 80) {
        location.reload();
    }

    document.getElementById("pullHint").innerText = "⬇ 下拉重新整理";
    pulling = false;
});
</script>

</body>
</html>
