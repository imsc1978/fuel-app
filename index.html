<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system;
}

.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}

.title{
  font-size:22px;
  margin-bottom:12px;
}

/* Tabs */
.tabs{display:flex;margin-bottom:12px;}
.tab{
  flex:1;
  padding:10px;
  text-align:center;
  background:#1c1c1e;
  border-radius:10px;
  margin-right:6px;
}
.tab.active{background:#2f6bff;}

/* Card */
.card{
  background:#1c1c1e;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}

/* Grid */
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}

.group{display:flex;flex-direction:column;gap:4px;}
label{font-size:13px;color:#aaa;}

input,select{
  width:100%;
  min-width:0;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px; /* 防縮放 */
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#1ea9ff,#2f6bff);
  color:#fff;
  margin-top:10px;
}

.sub-btn{background:#3a3a3c;}

.result{line-height:1.6;}

.item{
  padding:12px;
  border-bottom:1px solid #333;
}

.chart-wrap{height:220px;}
canvas{width:100%!important;height:100%!important;}

.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

<div class="title">⛽ 加油紀錄</div>

<div class="tabs">
  <div class="tab active" id="tabMain">紀錄</div>
  <div class="tab" id="tabHistory">📋 歷史</div>
</div>

<!-- 主頁 -->
<div id="mainPage">

<div class="card">

  <div class="grid3">
    <select id="source"></select>
    <select id="type"></select>
    <input id="price">
  </div>

  <div class="grid2">
    <div class="group">
      <label>金額</label>
      <input id="amount" inputmode="decimal">
    </div>
    <div class="group">
      <label>總里程</label>
      <input id="km" inputmode="numeric">
    </div>
  </div>

  <button id="saveBtn">儲存</button>
  <button class="sub-btn" id="deleteBtn">刪除最後一筆</button>

</div>

<div class="card result">
  距離：<span id="distance">-</span> km<br>
  油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card chart-wrap">
  <canvas id="chart"></canvas>
</div>

</div>

<!-- 歷史 -->
<div id="historyPage" class="hidden">
  <div class="card" id="historyList"></div>
</div>

</div>

<script>

/* ====== DOM ====== */
const mainPage = document.getElementById("mainPage")
const historyPage = document.getElementById("historyPage")

const tabMain = document.getElementById("tabMain")
const tabHistory = document.getElementById("tabHistory")

const sourceEl = document.getElementById("source")
const typeEl = document.getElementById("type")
const priceEl = document.getElementById("price")

const amountEl = document.getElementById("amount")
const kmEl = document.getElementById("km")

const saveBtn = document.getElementById("saveBtn")
const deleteBtn = document.getElementById("deleteBtn")

const distanceEl = document.getElementById("distance")
const kmplEl = document.getElementById("kmpl")

/* ====== 資料 ====== */
let records = JSON.parse(localStorage.getItem("fuel") || "[]")
let chart = null

const priceMap = {
  "中油": {"92":30.2,"95":31.2,"98":33.2,"柴油":28},
  "台塑": {"92":30,"95":31,"98":33,"柴油":27.8}
}

/* ====== 初始化選單 ====== */
sourceEl.innerHTML = `<option>中油</option><option>台塑</option>`
typeEl.innerHTML = `<option>92</option><option selected>95</option><option>98</option><option>柴油</option>`

function updatePrice(){
  priceEl.value = priceMap[sourceEl.value][typeEl.value]
}

sourceEl.onchange = updatePrice
typeEl.onchange = updatePrice
updatePrice()

/* ====== Tab ====== */
tabMain.onclick = () => {
  mainPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
  tabMain.classList.add("active")
  tabHistory.classList.remove("active")
}

tabHistory.onclick = () => {
  historyPage.classList.remove("hidden")
  mainPage.classList.add("hidden")
  tabHistory.classList.add("active")
  tabMain.classList.remove("active")
}

/* ====== 儲存 ====== */
saveBtn.onclick = () => {

  const amount = parseFloat(amountEl.value)
  const km = parseFloat(kmEl.value)
  const price = parseFloat(priceEl.value)

  if(!amount || !km){
    alert("請輸入完整資料")
    return
  }

  const last = records.at(-1)

  if(last && km <= last.km){
    alert("里程需大於上一筆")
    return
  }

  const dist = last ? km - last.km : 0
  const kmpl = dist ? dist / (amount / price) : 0

  records.push({
    date: new Date().toLocaleDateString(),
    km,
    kmpl
  })

  localStorage.setItem("fuel", JSON.stringify(records))

  amountEl.value=""

  render()
}

/* ====== 刪除 ====== */
deleteBtn.onclick = () => {
  if(!records.length) return
  records.pop()
  localStorage.setItem("fuel", JSON.stringify(records))
  render()
}

/* ====== 渲染 ====== */
function render(){

  if(records.length >= 2){
    const last = records.at(-1)
    const prev = records.at(-2)

    distanceEl.innerText = last.km - prev.km
    kmplEl.innerText = last.kmpl.toFixed(2)
  }

  renderHistory()
  drawChart()
}

/* ====== 歷史 ====== */
function renderHistory(){
  historyList.innerHTML = records.map(r=>`
    <div class="item">
      ${r.date}｜${r.km} km
    </div>
  `).reverse().join("")
}

/* ====== 圖表 ====== */
function drawChart(){

  const labels = records.map(r=>r.date)
  const data = records.map(r=>r.kmpl)

  if(chart) chart.destroy()

  chart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels,
      datasets:[{data}]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  })
}

render()

</script>

</body>
</html>
