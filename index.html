<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

.container{
  padding:16px;
  max-width:500px;
  margin:auto;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.tab{
  flex:1;
  padding:12px;
  border-radius:12px;
  text-align:center;
  background:#2c2c2e;
}

.active{
  background:#4facfe;
}

.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.col{
  flex:1;
}

label{
  font-size:12px;
  color:#aaa;
  margin-bottom:4px;
  display:block;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#4facfe;
  color:#fff;
  font-size:16px;
}

.hidden{display:none}

.item{
  padding:10px 0;
  border-bottom:1px solid #333;
}
</style>
</head>

<body>

<div class="container">

<h2>⛽ 加油紀錄</h2>

<div class="tabs">
<div id="tabRecord" class="tab active">紀錄</div>
<div id="tabHistory" class="tab">歷史</div>
</div>

<!-- ===== 記錄頁 ===== -->
<div id="recordPage">

<div class="card">

<div class="row">
<div class="col">
<label>油品來源</label>
<select id="source">
<option>中油</option>
<option>台塑</option>
</select>
</div>

<div class="col">
<label>油種</label>
<select id="type">
<option>92</option>
<option selected>95</option>
<option>98</option>
<option>柴油</option>
</select>
</div>

<div class="col">
<label>油價</label>
<input id="price" inputmode="decimal">
</div>
</div>

<div class="row">
<div class="col">
<label>金額</label>
<input id="amount" inputmode="decimal">
</div>

<div class="col">
<label>總里程</label>
<input id="km" inputmode="numeric">
</div>
</div>

<button onclick="save()">儲存</button>

</div>

<div class="card" id="result">-</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<!-- ===== 歷史 ===== -->
<div id="historyPage" class="hidden">
<div class="card" id="historyList"></div>
</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("fuel")||"[]")

/* ===== tab ===== */
tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
  tabRecord.classList.add("active")
  tabHistory.classList.remove("active")
}

tabHistory.onclick=()=>{
  recordPage.classList.add("hidden")
  historyPage.classList.remove("hidden")
  tabRecord.classList.remove("active")
  tabHistory.classList.add("active")
  renderHistory()
}

/* ===== 油價 ===== */
const priceMap={92:30,95:31.2,98:33,柴油:28}
type.onchange=()=>price.value=priceMap[type.value]
price.value=priceMap[type.value]

/* ===== 自動帶入里程 ===== */
function preloadKm(){
  if(data.length){
    km.value = data[data.length-1].km
  }
}

/* ===== 儲存 ===== */
function save(){

  const amountVal=parseFloat(amount.value)
  const kmVal=parseFloat(km.value)
  const priceVal=parseFloat(price.value)

  if(!amountVal || !kmVal){
    alert("請輸入完整")
    return
  }

  const last=data[data.length-1]

  let distance=0

  if(last){
    distance = kmVal - last.km

    if(distance <= 0){
      alert("里程需大於上一筆")
      return
    }
  }

  const liter = amountVal / priceVal
  const avg = distance / liter

  const item={
    date:new Date().toISOString().slice(0,10),
    km:kmVal,
    distance,
    avg
  }

  data.push(item)
  localStorage.setItem("fuel",JSON.stringify(data))

  preloadKm()
  update()
}

/* ===== 更新 ===== */
function update(){

  if(data.length < 2){
    result.innerHTML="距離：-- km<br>油耗：-- km/L"
    return
  }

  const last=data[data.length-1]

  result.innerHTML=
  `距離：${last.distance.toFixed(0)} km<br>
   油耗：${last.avg.toFixed(2)} km/L`

  drawChart()
}

/* ===== 歷史 ===== */
function renderHistory(){
  historyList.innerHTML=data.map(i=>
    `<div class="item">${i.date} | ${i.km} km</div>`
  ).join("")
}

/* ===== 圖表（週 + 堆疊） ===== */
let chart

function getWeek(){
  const now=new Date()
  const day=now.getDay()||7
  const monday=new Date(now)
  monday.setDate(now.getDate()-day+1)

  return Array.from({length:7},(_,i)=>{
    const d=new Date(monday)
    d.setDate(monday.getDate()+i)
    return d.toISOString().slice(0,10)
  })
}

function drawChart(){

  if(chart) chart.destroy()

  const week=getWeek()

  const grouped={}
  week.forEach(d=>grouped[d]=[])

  data.forEach(i=>{
    if(grouped[i.date]) grouped[i.date].push(i.avg)
  })

  const max=Math.max(...Object.values(grouped).map(a=>a.length))

  const datasets=[]

  for(let i=0;i<max;i++){
    datasets.push({
      data:week.map(d=>grouped[d][i]||0),
      backgroundColor:`hsl(${i*70},70%,60%)`,
      stack:"a"
    })
  }

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels:week.map(d=>d.slice(5)),datasets},
    options:{
      plugins:{legend:false},
      scales:{
        x:{stacked:true},
        y:{stacked:true}
      }
    }
  })
}

/* ===== init ===== */
preloadKm()
update()

</script>

</body>
</html>
