<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta charset="UTF-8">
<title>加油紀錄</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system;
}

.container{
  padding:16px;
}

h1{
  font-size:28px;
}

.card{
  background:#1c1c1e;
  border-radius:16px;
  padding:16px;
  margin-top:16px;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input,select{
  flex:1;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#2aa7ff,#3b6cff);
  color:#fff;
  font-size:18px;
}

.label{
  font-size:14px;
  color:#aaa;
  margin-bottom:4px;
}

.tab{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.tab button{
  flex:1;
  background:#2c2c2e;
}

.tab .active{
  background:#3b6cff;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>⛽ 加油紀錄</h1>

<div class="tab">
  <button id="tabRecord" class="active">紀錄</button>
  <button id="tabHistory">歷史</button>
</div>

<!-- 紀錄 -->
<div id="recordPage">

<div class="card">

<div class="row">
  <select id="source">
    <option>中油</option>
    <option>台塑</option>
  </select>

  <select id="fuel">
    <option value="92">92</option>
    <option value="95" selected>95</option>
    <option value="98">98</option>
    <option value="diesel">柴油</option>
  </select>

  <input id="price" type="number">
</div>

<div class="row">
  <div style="flex:1">
    <div class="label">金額</div>
    <input id="amount" type="number" inputmode="decimal">
  </div>

  <div style="flex:1">
    <div class="label">總里程</div>
    <input id="km" type="number" inputmode="numeric">
  </div>
</div>

<button onclick="save()">儲存</button>

</div>

<div class="card">
距離：<span id="distance">-</span> km<br>
油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<!-- 歷史 -->
<div id="historyPage" class="hidden">
  <div class="card" id="historyList"></div>
</div>

</div>

<script>
let records = JSON.parse(localStorage.getItem("fuelRecords")||"[]")
let chart

// 🔥 油價表
const priceMap={
  "92":29.2,
  "95":31.2,
  "98":33.2,
  "diesel":27.5
}

// 自動油價
document.getElementById("fuel").onchange=e=>{
  document.getElementById("price").value=priceMap[e.target.value]
}

// 初始化
document.getElementById("price").value=31.2

function save(){

  const price = parseFloat(price.value)
  const amount = parseFloat(amount.value)
  const kmVal = parseFloat(km.value)

  if(!price || !amount || !kmVal){
    alert("請填完整")
    return
  }

  if(records.length>0){
    const last = records[records.length-1].km
    if(kmVal < last){
      alert("里程不能小於上一筆")
      return
    }
  }

  const liter = amount / price

  let distance = 0
  let kmpl = 0

  if(records.length>0){
    const last = records[records.length-1].km
    distance = kmVal - last
    kmpl = distance / liter
  }

  records.push({
    date: new Date().toISOString().slice(0,10),
    km: kmVal,
    kmpl: kmpl
  })

  localStorage.setItem("fuelRecords",JSON.stringify(records))

  update()
  drawChart()
  renderHistory()

  amount.value=""
}

function update(){

  if(records.length<2){
    distance.innerText="-"
    kmpl.innerText="-"
    return
  }

  const last = records[records.length-1]
  const prev = records[records.length-2]

  const d = last.km - prev.km

  distance.innerText = d
  kmpl.innerText = last.kmpl.toFixed(2)
}

// 🔥 重點：堆疊圖（同一天一柱）
function drawChart(){

  if(chart) chart.destroy()

  if(records.length===0) return

  const grouped={}

  records.forEach(r=>{
    if(!grouped[r.date]) grouped[r.date]=[]
    grouped[r.date].push(r)
  })

  const dates=Object.keys(grouped)

  const maxCount = Math.max(...dates.map(d=>grouped[d].length))

  const datasets=[]

  for(let i=0;i<maxCount;i++){
    datasets.push({
      data: dates.map(d=>grouped[d][i]?.kmpl || 0),
      backgroundColor:`hsl(${i*60},70%,60%)`
    })
  }

  chart = new Chart(chartCanvas,{
    type:"bar",
    data:{
      labels:dates,
      datasets
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{stacked:true},
        y:{stacked:true}
      }
    }
  })
}

// 歷史
function renderHistory(){
  historyList.innerHTML = records.map(r=>`
    <div>${r.date} | ${r.km} km</div>
  `).join("<hr>")
}

// 切換頁
tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
  tabRecord.classList.add("active")
  tabHistory.classList.remove("active")
}

tabHistory.onclick=()=>{
  historyPage.classList.remove("hidden")
  recordPage.classList.add("hidden")
  tabHistory.classList.add("active")
  tabRecord.classList.remove("active")
}

// init
update()
drawChart()
renderHistory()
</script>

</body>
</html>
