<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>加油紀錄</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#000;
  color:#fff;
}

.container{
  padding:20px;
}

.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:16px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#4facfe,#3f5efb);
  color:#fff;
  font-size:18px;
  margin-top:12px;
}

.tab{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tab button{
  flex:1;
  background:#2c2c2e;
}

.active{
  background:#3f5efb !important;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h2>⛽ 加油紀錄</h2>

<div class="tab">
  <button id="tabRecord" class="active">紀錄</button>
  <button id="tabHistory">歷史</button>
</div>

<!-- 記錄頁 -->
<div id="recordPage">

<div class="card">

<div class="grid3">
<select id="source">
  <option>中油</option>
  <option>台塑</option>
</select>

<select id="type">
  <option>92</option>
  <option selected>95</option>
  <option>98</option>
  <option>柴油</option>
</select>

<input id="price" type="number" placeholder="油價">
</div>

<div class="grid">
<input id="amount" type="number" placeholder="金額">
<input id="km" type="number" placeholder="總里程">
</div>

<button onclick="save()">儲存</button>

</div>

<div class="card">
<div id="result">距離：- km<br>油耗：- km/L</div>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<!-- 歷史頁 -->
<div id="historyPage" class="hidden">
<div class="card" id="history"></div>
</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("fuel") || "[]")

function formatDate(d){
  return d.toISOString().split("T")[0]
}

function save(){

  const amount = parseFloat(document.getElementById("amount").value)
  const km = parseFloat(document.getElementById("km").value)
  const price = parseFloat(document.getElementById("price").value)

  if(!amount || !km || !price){
    alert("請輸入完整")
    return
  }

  const last = data[data.length-1]

  let distance = 0
  if(last){
    distance = km - last.km
  }

  const liter = amount / price
  const avg = distance && liter ? (distance / liter) : 0

  const item = {
    date: formatDate(new Date()),
    km,
    amount,
    price,
    distance,
    avg
  }

  data.push(item)
  localStorage.setItem("fuel", JSON.stringify(data))

  update()
}

function update(){

  const last = data[data.length-1]

  if(!last){
    document.getElementById("result").innerHTML="距離：- km<br>油耗：- km/L"
    return
  }

  document.getElementById("result").innerHTML =
    `距離：${last.distance} km<br>油耗：${last.avg.toFixed(2)} km/L`

  renderHistory()
  drawChart()
}

function renderHistory(){

  const el = document.getElementById("history")
  el.innerHTML=""

  data.slice().reverse().forEach(i=>{
    el.innerHTML += `<div>${i.date} | ${i.km} km</div><hr>`
  })
}

let chart

function drawChart(){

  if(chart) chart.destroy()

  const labels = [...new Set(data.map(i=>i.date))]

  const grouped = {}

  labels.forEach(d=>{
    grouped[d]=[]
  })

  data.forEach(i=>{
    grouped[i.date].push(i.avg)
  })

  const datasets = []

  const max = Math.max(...Object.values(grouped).map(a=>a.length),1)

  for(let i=0;i<max;i++){
    datasets.push({
      label:`第${i+1}次`,
      data: labels.map(d=>grouped[d][i] || 0),
      backgroundColor:`hsl(${i*60},70%,60%)`,
      stack:"a"
    })
  }

  chart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels,datasets},
    options:{
      responsive:true,
      scales:{
        x:{stacked:true},
        y:{stacked:true}
      }
    }
  })
}

/* tab */
tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
  tabRecord.classList.add("active")
  tabHistory.classList.remove("active")
}

tabHistory.onclick=()=>{
  recordPage.classList.add("hidden")
  historyPage.classList.remove("hidden")
  tabHistory.classList.add("active")
  tabRecord.classList.remove("active")
}

update()

</script>

</body>
</html>
