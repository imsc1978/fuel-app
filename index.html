<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>加油紀錄</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system;
}

.container{
  padding:16px;
  max-width:500px;
  margin:auto;
}

/* tabs */
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.tab{
  flex:1;
  padding:12px;
  border-radius:12px;
  text-align:center;
  background:#333;
}

.tab.active{
  background:#4da3ff;
}

/* card */
.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
}

/* form */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;

}

input, select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#4da3ff;
  color:#fff;
  font-size:16px;
}

/* history */
.item{
  padding:12px 0;
  border-bottom:1px solid #333;
}

/* hidden */
.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h2>⛽ 加油紀錄</h2>

<!-- tabs -->
<div class="tabs">
  <div id="tabRecord" class="tab active">紀錄</div>
  <div id="tabHistory" class="tab">歷史</div>
</div>

<!-- =========================
📥 RECORD PAGE
========================= -->
<div id="recordPage">

<div class="card">

<div class="grid">
  <select id="source">
    <option value="中油">中油</option>
    <option value="台塑">台塑</option>
  </select>

  <select id="type">
    <option value="92">92</option>
    <option value="95" selected>95</option>
    <option value="98">98</option>
  </select>

  <input id="price" type="number" placeholder="油價" inputmode="decimal">
</div>

<div class="grid">
  <input id="amount" type="number" placeholder="金額" inputmode="decimal">
  <input id="mileage" type="number" placeholder="總里程" inputmode="numeric">
</div>

<button id="saveBtn">儲存</button>

</div>

<div class="card">
  距離：<span id="distance">--</span> km<br>
  油耗：<span id="efficiency">--</span> km/L
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

</div>

<!-- =========================
📜 HISTORY PAGE
========================= -->
<div id="historyPage" class="hidden">
  <div id="historyList" class="card"></div>
</div>

</div>

<script>

/* =========================
⚙️ CONFIG
========================= */
const KEY = "fuel";

/* =========================
💾 DATA
========================= */
function getData(){
  return JSON.parse(localStorage.getItem(KEY)||"[]");
}

function saveData(data){
  localStorage.setItem(KEY, JSON.stringify(data));
}

/* =========================
🧮 CALC
========================= */
function calc(last, now){
  if(!last) return {distance:0, eff:0};

  const distance = now.mileage - last.mileage;

  if(distance<=0 || !now.amount){
    return {distance:0, eff:0};
  }

  const liter = now.amount / now.price;
  if(liter===0) return {distance:0, eff:0};

  return {
    distance,
    eff: distance / liter
  };
}

/* =========================
🎨 UI
========================= */
function updateUI(d, e){
  document.getElementById("distance").innerText =
    d ? d.toFixed(0) : "--";

  document.getElementById("efficiency").innerText =
    e ? e.toFixed(2) : "--";
}

/* =========================
📊 CHART
========================= */
let chart;

function drawChart(){
  const data = getData();

  const labels = data.map(d=>d.date);
  const values = data.map(d=>d.eff||0);

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels,
      datasets:[{
        data:values
      }]
    }
  });
}

/* =========================
📜 HISTORY
========================= */
function renderHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML="";

  const data = getData().slice().reverse();

  data.forEach((d,i)=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerText = `${d.date} | ${d.mileage} km`;

    div.onclick = ()=>{
      if(!confirm("刪除這筆？")) return;

      const origin = getData();
      origin.splice(origin.length-1-i,1);
      saveData(origin);
      renderHistory();
      drawChart();
    };

    list.appendChild(div);
  });
}

/* =========================
🖱️ EVENT
========================= */

document.getElementById("saveBtn").onclick = ()=>{

  const amount = parseFloat(amountEl.value);
  const mileage = parseFloat(mileageEl.value);

  if(!amount || !mileage){
    alert("請輸入完整");
    return;
  }

  const data = getData();
  const last = data[data.length-1];

  const record = {
    date:new Date().toISOString().slice(0,10),
    amount,
    mileage,
    price:30
  };

  const result = calc(last, record);

  record.distance = result.distance;
  record.eff = result.eff;

  data.push(record);
  saveData(data);

  updateUI(result.distance, result.eff);
  drawChart();

  amountEl.value="";
  mileageEl.value="";
};

/* tabs */
const tabRecord = document.getElementById("tabRecord");
const tabHistory = document.getElementById("tabHistory");

tabRecord.onclick=()=>{
  tabRecord.classList.add("active");
  tabHistory.classList.remove("active");

  recordPage.classList.remove("hidden");
  historyPage.classList.add("hidden");
};

tabHistory.onclick=()=>{
  tabHistory.classList.add("active");
  tabRecord.classList.remove("active");

  recordPage.classList.add("hidden");
  historyPage.classList.remove("hidden");

  renderHistory();
};

/* =========================
🚀 INIT
========================= */

const amountEl = document.getElementById("amount");
const mileageEl = document.getElementById("mileage");

function init(){
  const data = getData();

  if(data.length){
    mileageEl.value = data[data.length-1].mileage;
  }

  drawChart();
}

init();

</script>

</body>
</html>
