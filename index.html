<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: white;
}
.card {
    background: #222;
    margin: 10px;
    padding: 15px;
    border-radius: 12px;
}
input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    background: #333;
    color: white;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: #007aff;
    color: white;
}
</style>
</head>

<body>

<div class="card">
    <h2>⛽ 加油紀錄</h2>
    <input id="amount" placeholder="金額" inputmode="decimal">
    <input id="mileage" placeholder="里程" inputmode="numeric">
    <button onclick="saveData()">儲存</button>
</div>

<div class="card">
    <div id="distance">距離：0 km</div>
    <div id="efficiency">油耗：- km/L</div>
</div>

<canvas id="chart"></canvas>

<script>
console.log("JS 有執行"); // ⭐ debug用

const price = 31.2;

let lastMileage = Number(localStorage.getItem("lastMileage") || 0);

// ⭐ 安全資料
let records = [];

try {
    let raw = JSON.parse(localStorage.getItem("records") || "[]");

    if (Array.isArray(raw)) {
        records = raw.filter(r => r && r.date && r.value);
    }
} catch (e) {
    records = [];
}

function getToday() {
    return new Date().toISOString().split("T")[0];
}

function getWeekLabel(dateStr) {
    const d = new Date(dateStr);
    const days = ["日","一","二","三","四","五","六"];
    return days[d.getDay()] + "（" + (d.getMonth()+1) + "/" + d.getDate() + "）";
}

function getLast7Days() {
    let arr = [];

    for (let i = 6; i >= 0; i--) {
        let d = new Date();
        d.setDate(d.getDate() - i);

        let str = d.toISOString().split("T")[0];

        let found = records.find(r => r.date === str);

        arr.push({
            date: str,
            value: found ? Number(found.value) : null
        });
    }

    return arr;
}

// ⭐ 建圖（防炸）
let chart;

try {
    const ctx = document.getElementById('chart').getContext('2d');

    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [],
            datasets: [{
                label: 'km/L',
                data: []
            }]
        }
    });

} catch (e) {
    console.error("Chart錯誤", e);
}

// ⭐ 更新圖
function updateChart() {
    if (!chart) return;

    let week = getLast7Days();

    chart.data.labels = week.map(d => getWeekLabel(d.date));
    chart.data.datasets[0].data = week.map(d => d.value);

    chart.update();
}

// ⭐ 儲存
function saveData() {
    let amount = Number(document.getElementById("amount").value);
    let mileage = Number(document.getElementById("mileage").value);

    if (!amount || !mileage) return;

    if (lastMileage > 0) {
        let distance = mileage - lastMileage;
        let fuel = amount / price;
        let eff = distance / fuel;

        document.getElementById("distance").innerText = "距離：" + distance + " km";
        document.getElementById("efficiency").innerText = "油耗：" + eff.toFixed(2) + " km/L";

        let today = getToday();

        records.push({
            date: today,
            value: eff
        });

        localStorage.setItem("records", JSON.stringify(records));
    }

    localStorage.setItem("lastMileage", mileage);
    lastMileage = mileage;

    updateChart();
}

// ⭐ 初始化
updateChart();
</script>

</body>
</html>
