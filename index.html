<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    background: #000;
    color: #fff;
}

.app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
}

/* 卡片 /
.card {
    background: #1c1c1e;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
}

/ 標題 /
.title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 16px;
}

/ 🔥 三欄 /
.row-3 {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.row-3 select,
.row-3 input {
    flex: 1;
}

/ 🔥 兩欄 /
.row-2 {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.row-2 input {
    flex: 1;
}

/ 輸入 /
input, select {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: #2c2c2e;
    color: #fff;
    font-size: 16px;
}

/ 按鈕 /
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    color: #fff;
    background: linear-gradient(90deg,#00c6ff,#0072ff);
}

/ 資訊 */
.stat {
    font-size: 20px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

<div class="title">⛽ 加油紀錄</div>

<div class="card">

    <!-- 🔥 三欄 -->
    <div class="row-3">
        <select id="source">
            <option>中油</option>
            <option>台塑</option>
        </select>

        <select id="type">
            <option value="92">92</option>
            <option value="95" selected>95</option>
            <option value="98">98</option>
            <option value="diesel">柴油</option>
        </select>

        <input id="price" type="number" value="31.2" step="0.1">
    </div>

    <!-- 🔥 兩欄 -->
    <div class="row-2">
        <input id="money" type="number" placeholder="輸入金額" inputmode="numeric">
        <input id="mileage" type="number" placeholder="輸入里程" inputmode="numeric">
    </div>

    <button onclick="save()">儲存</button>

</div>

<div class="card">
    <div>距離：<span id="distance">0</span> km</div>
    <div>油耗：<span id="km">-</span> km/L</div>
</div>

<div class="card">
    <canvas id="chart"></canvas>
</div>

</div>

<script>
let records = JSON.parse(localStorage.getItem("fuel") || "[]");

function save() {
    let money = Number(document.getElementById("money").value);
    let mileage = Number(document.getElementById("mileage").value);
    let price = Number(document.getElementById("price").value);

    if (!money || !mileage) return;

    records.push({
        money,
        mileage,
        price,
        date: new Date().toISOString()
    });

    localStorage.setItem("fuel", JSON.stringify(records));

    document.getElementById("money").value = "";
    render();
}

function render() {
    if (records.length < 2) return;

    let last = records[records.length - 1];
    let prev = records[records.length - 2];

    let distance = last.mileage - prev.mileage;
    let liter = last.money / last.price;
    let km = distance / liter;

    document.getElementById("distance").innerText = distance;
    document.getElementById("km").innerText = km.toFixed(2);

    drawChart();
}

function drawChart() {
    let labels = [];
    let data = [];

    for (let i = 1; i < records.length; i++) {
        let d = new Date(records[i].date);
        labels.push((d.getMonth()+1) + "/" + d.getDate());

        let dist = records[i].mileage - records[i-1].mileage;
        let liter = records[i].money / records[i].price;
        data.push((dist / liter).toFixed(2));
    }

    new Chart(document.getElementById("chart"), {
        type: "bar",
        data: {
            labels,
            datasets: [{
                label: "km/L",
                data
            }]
        }
    });
}

render();
</script>

</body>
</html>
