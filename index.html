<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加油紀錄</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system;
}

.container{
  padding:16px;
  max-width:500px;
  margin:auto;
}

/* tabs */
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.tab{
  flex:1;
  padding:12px;
  border-radius:12px;
  text-align:center;
  background:#333;
}

.tab.active{
  background:#4da3ff;
}

/* card */
.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr)); /* ⭐ 關鍵 */
  gap:10px;
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr)); /* ⭐ 一樣邏輯 */
  gap:10px;
}

label{
  font-size:13px;
  color:#aaa;
  margin-bottom:4px;
  display:block;
}

input, select{
  width:100%;
  min-width:0;          /* ⭐ 這行是關鍵 */
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#4da3ff;
  color:#fff;
  font-size:16px;
}

.item{
  padding:12px 0;
  border-bottom:1px solid #333;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h2>⛽ 加油紀錄</h2>

<!-- tabs -->
<div class="tabs">
  <div id="tabRecord" class="tab active">紀錄</div>
  <div id="tabHistory" class="tab">歷史</div>
</div>

<!-- ================= RECORD ================= -->
<div id="recordPage">

  <div class="card">

    <!-- 第一排 -->
    <div class="grid">
      <div>
        <label>油品來源</label>
        <select id="source">
          <option value="中油">中油</option>
          <option value="台塑">台塑</option>
        </select>
      </div>

      <div>
        <label>油種</label>
        <select id="type">
  <option value="92">92</option>
  <option value="95" selected>95</option>
  <option value="98">98</option>
  <option value="diesel">柴油</option>
</select>
      </div>

      <div>
        <label>油價</label>
        <input id="price" type="number" placeholder="油價">
      </div>
    </div>

    <!-- 第二排 -->
    <div class="grid-2">
      <div>
        <label>金額</label>
        <input id="amount" type="tel" inputmode="numeric" placeholder="金額">      </div>

      <div>
        <label>總里程</label>
        <input id="mileage" type="tel" inputmode="numeric" placeholder="總里程">      </div>
    </div>

    <button id="saveBtn">儲存</button>

  </div>

  <!-- 結果 -->
  <div class="card">
    距離：<span id="distance">--</span> km<br>
    油耗：<span id="efficiency">--</span> km/L
  </div>

  <!-- 圖表 -->
  <div class="card">
    <canvas id="chart"></canvas>
  </div>

</div>

<!-- ================= HISTORY ================= -->
<div id="historyPage" class="hidden">
  <div id="historyList" class="card"></div>
</div>

</div>

<script>

/* ================= CONFIG ================= */
const KEY = "fuel";

/* ================= 油價對照 ================= */
const priceMap = {
  "中油": {
    "92": 29.2,
    "95": 31.2,
    "98": 33.2,
    "diesel": 27.5
  },
  "台塑": {
    "92": 29.0,
    "95": 31.0,
    "98": 33.0,
    "diesel": 27.3
  }
};

/* ================= 元素 ================= */
const sourceEl = document.getElementById("source");
const typeEl = document.getElementById("type");
const priceEl = document.getElementById("price");
const amountEl = document.getElementById("amount");
const mileageEl = document.getElementById("mileage");

/* ================= 油價自動帶入 ================= */
function updatePrice(){
  const s = sourceEl.value;
  const t = typeEl.value;
  if(priceMap[s] && priceMap[s][t]){
    priceEl.value = priceMap[s][t];
  }
}

/* ================= DATA ================= */
function getData(){
  return JSON.parse(localStorage.getItem(KEY)||"[]");
}

function saveData(data){
  localStorage.setItem(KEY, JSON.stringify(data));
}

/* ================= CALC ================= */
function calc(last, now){
  if(!last) return {distance:0, eff:0};

  const distance = now.mileage - last.mileage;
  if(distance<=0 || !now.amount || !now.price) return {distance:0, eff:0};

  const liter = now.amount / now.price;
  return {distance, eff: distance / liter};
}

/* ================= UI ================= */
function updateUI(d,e){
  document.getElementById("distance").innerText = d ? d.toFixed(0) : "--";
  document.getElementById("efficiency").innerText = e ? e.toFixed(2) : "--";
}

/* ================= CHART ================= */
let chart;
function drawChart(){
  const data = getData();
  const labels = data.map(d=>d.date);
  const values = data.map(d=>d.eff||0);

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels,
      datasets:[{data:values}]
    },
    options:{
      plugins:{legend:{display:false}}
    }
  });
}

/* ================= HISTORY ================= */
function renderHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML="";

  const data = getData().slice().reverse();

  data.forEach((d,i)=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerText = `${d.date} | ${d.mileage} km | ${d.eff?.toFixed(2)||"--"}`;

    div.onclick = ()=>{
      if(!confirm("刪除這筆？")) return;

      const origin = getData();
      origin.splice(origin.length-1-i,1); // index安全
      saveData(origin);
      renderHistory();
      drawChart();
    };

    list.appendChild(div);
  });
}

/* ================= SAVE ================= */
document.getElementById("saveBtn").onclick = ()=>{

  const amount = parseFloat(amountEl.value);
  const mileage = parseFloat(mileageEl.value);
  const price = parseFloat(priceEl.value);

  if(!amount || !mileage || !price){
    alert("請輸入完整");
    return;
  }

  const data = getData();
  const last = data[data.length-1];

  const record = {
    date:new Date().toISOString().slice(0,10),
    amount,
    mileage,
    price
  };

  const r = calc(last, record);
  record.distance = r.distance;
  record.eff = r.eff;

  data.push(record);
saveData(data);

/* ⭐ UI 更新 */
updateUI(result.distance, result.eff);
drawChart();

/* ⭐ 先清金額 */
amountEl.value = "";

/* ⭐ 再 focus */
amountEl.focus();

/* ⭐ 最後才設里程（避免干擾輸入） */
mileageEl.value = record.mileage;
};

/* ================= TABS ================= */
tabRecord.onclick=()=>{
  tabRecord.classList.add("active");
  tabHistory.classList.remove("active");
  recordPage.classList.remove("hidden");
  historyPage.classList.add("hidden");
};

tabHistory.onclick=()=>{
  tabHistory.classList.add("active");
  tabRecord.classList.remove("active");
  recordPage.classList.add("hidden");
  historyPage.classList.remove("hidden");
  renderHistory();
};

/* ================= INIT ================= */
function init(){
  updatePrice();
  drawChart();

  const data = getData();
  if(data.length){
    mileageEl.value = data[data.length-1].mileage;
  }
}

/* 只綁一次 */
sourceEl.addEventListener("change", updatePrice);
typeEl.addEventListener("change", updatePrice);

init();

</script>

</body>
</html>
