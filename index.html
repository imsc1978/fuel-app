<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>油耗管理</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0c0c0c;
    color: #fff;
}

/* 標題 */
.header {
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

/* 卡片 */
.card {
    background: #1c1c1e;
    margin: 12px;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

/* 油價 */
.price {
    color: #aaa;
    margin-bottom: 10px;
}

/* 輸入框 */
input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    background: #2c2c2e;
    color: white;
    font-size: 16px;
    box-sizing: border-box; /* ⭐ 修正爆版 */
}

/* 按鈕 */
button {
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: white;
    font-size: 18px;
    font-weight: bold;
}

/* 結果區 */
.result {
    margin-top: 10px;
}

.big-number {
    font-size: 34px;
    font-weight: bold;
    margin-top: 6px;
}

.label {
    color: #aaa;
    margin-top: 10px;
}

/* 區塊標題 */
.section-title {
    font-size: 18px;
    margin: 16px;
    color: #4cd964;
}
</style>
</head>

<body>

<div class="header">⛽ 加油紀錄</div>

<div class="card">
    <div class="price">油價（中油95）：31.2 元/L</div>

    <input id="amount" placeholder="輸入金額" inputmode="numeric">
    <input id="mileage" placeholder="輸入里程" inputmode="numeric">

    <button onclick="saveData()">儲存</button>
</div>

<div class="card result">
    <div class="label">行駛距離</div>
    <div class="big-number" id="distance">0 km</div>

    <div class="label">平均油耗</div>
    <div class="big-number" id="efficiency">- km/L</div>
</div>

<div class="section-title">📊 本週油耗</div>

<script>
const price = 31.2;

// ⭐ 讀取上次里程
let lastMileage = localStorage.getItem("lastMileage");
if (lastMileage !== null) {
    lastMileage = parseFloat(lastMileage);
}

// ⭐ 自動帶入
if (lastMileage !== null) {
    document.getElementById("mileage").value = lastMileage;
}

// ⭐ 游標自動在金額
document.getElementById("amount").focus();

function saveData() {
    const amount = parseFloat(document.getElementById("amount").value);
    const mileage = parseFloat(document.getElementById("mileage").value);

    if (!amount || !mileage) return;

    if (lastMileage !== null) {
        const distance = mileage - lastMileage;
        const fuel = amount / price;
        const efficiency = distance / fuel;

        document.getElementById("distance").innerText = distance + " km";
        document.getElementById("efficiency").innerText = efficiency.toFixed(2) + " km/L";
    }

    // ⭐ 存起來（關鍵）
    localStorage.setItem("lastMileage", mileage);

    lastMileage = mileage;

    // ⭐ 清空金額（讓下一次更快輸入）
    document.getElementById("amount").value = "";
}
</script>

</body>
</html>
