<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>加油紀錄</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#000;
  color:#fff;
}

.container{
  padding:16px;
}

h1{
  font-size:28px;
  margin-bottom:16px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.tab{
  flex:1;
  padding:14px;
  border-radius:16px;
  background:#222;
  text-align:center;
}

.tab.active{
  background:#3b6cff;
}

.card{
  background:#1a1a1a;
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
}

.row{
  display:flex;
  gap:10px;
}

.col{
  flex:1;
}

label{
  font-size:13px;
  color:#aaa;
  margin-bottom:6px;
  display:block;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#2a2a2a;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:none;
  background:linear-gradient(90deg,#29a3ff,#3b6cff);
  color:#fff;
  font-size:18px;
  margin-top:12px;
}

.hidden{
  display:none;
}

.stat{
  font-size:18px;
  line-height:1.6;
}

.history-item{
  padding:12px 0;
  border-bottom:1px solid #333;
}
</style>
</head>

<body>
<div class="container">

<h1>⛽ 加油紀錄</h1>

<div class="tabs">
  <div id="tabRecord" class="tab active">紀錄</div>
  <div id="tabHistory" class="tab">歷史</div>
</div>

<!-- 記錄頁 -->
<div id="recordPage">

<div class="card">

<div class="row">
  <div class="col">
    <label>油品來源</label>
    <select id="brand">
      <option>中油</option>
      <option>台塑</option>
    </select>
  </div>

  <div class="col">
    <label>油種</label>
    <select id="type">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
      <option value="diesel">柴油</option>
    </select>
  </div>

  <div class="col">
    <label>油價</label>
    <input id="price" readonly>
  </div>
</div>

<div class="row" style="margin-top:10px;">
  <div class="col">
    <label>金額</label>
    <input id="amount" type="text" inputmode="decimal" placeholder="輸入金額">
  </div>

  <div class="col">
    <label>總里程</label>
    <input id="mileage" type="text" inputmode="numeric" placeholder="輸入里程">
  </div>
</div>

<button id="save">儲存</button>

</div>

<div class="card stat">
距離：<span id="distance">-</span> km<br>
油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<!-- 歷史 -->
<div id="historyPage" class="hidden">
<div class="card" id="historyList"></div>
</div>

</div>

<script>

const prices = {
  "92":29,
  "95":31.2,
  "98":33.2,
  "diesel":27
}

const typeEl = document.getElementById("type")
const priceEl = document.getElementById("price")
const mileageEl = document.getElementById("mileage")

function updatePrice(){
  priceEl.value = prices[typeEl.value]
}

typeEl.onchange = updatePrice
updatePrice()

let data = JSON.parse(localStorage.getItem("fuel")||"[]")

// 自動帶入最後里程
if(data.length){
  mileageEl.value = data[data.length-1].mileage
}

document.getElementById("save").onclick = ()=>{
  const amount = parseFloat(amountEl.value)
  const mileage = parseInt(mileageEl.value)
  const price = parseFloat(priceEl.value)

  if(!amount || !mileage) return alert("請輸入完整")

  if(data.length && mileage <= data[data.length-1].mileage){
    return alert("里程需大於上一筆")
  }

  const liters = amount / price

  data.push({
    date: new Date().toISOString().slice(0,10),
    mileage,
    liters
  })

  localStorage.setItem("fuel",JSON.stringify(data))

  amountEl.value=""
  mileageEl.value = mileage

  update()
}

const amountEl = document.getElementById("amount")

function update(){

  if(data.length < 2){
    distance.innerText = "-"
    kmpl.innerText = "-"
    drawChart()
    renderHistory()
    return
  }

  let totalDist = 0
  let totalFuel = 0

  for(let i=1;i<data.length;i++){
    totalDist += data[i].mileage - data[i-1].mileage
    totalFuel += data[i].liters
  }

  distance.innerText = totalDist
  kmpl.innerText = (totalDist/totalFuel).toFixed(2)

  drawChart()
  renderHistory()
}

function getWeekDates(){
  const now = new Date()
  const day = now.getDay() || 7
  const monday = new Date(now)
  monday.setDate(now.getDate() - day + 1)

  let arr=[]
  for(let i=0;i<7;i++){
    let d = new Date(monday)
    d.setDate(monday.getDate()+i)
    arr.push(d.toISOString().slice(5,10))
  }
  return arr
}

let chart

function drawChart(){

  const labels = getWeekDates()

  let datasets=[]

  const maxStack = 5

  for(let i=0;i<maxStack;i++){
    datasets.push({
      data: labels.map(()=>0),
      backgroundColor:`hsl(${i*60},70%,60%)`,
      stack:"stack"
    })
  }

  let dayMap = {}

  data.forEach((d)=>{
    const key = d.date.slice(5,10)
    if(!dayMap[key]) dayMap[key]=[]
    dayMap[key].push(d)
  })

  labels.forEach((day,idx)=>{
    const list = dayMap[day]||[]

    list.forEach((item,i)=>{
      datasets[i].data[idx] = item.liters
    })
  })

  if(chart) chart.destroy()

  chart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels,
      datasets
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{stacked:true},
        y:{stacked:true}
      }
    }
  })
}

function renderHistory(){
  const el = document.getElementById("historyList")
  el.innerHTML=""

  data.slice().reverse().forEach(d=>{
    const div = document.createElement("div")
    div.className="history-item"
    div.innerText = `${d.date} | ${d.mileage} km`
    el.appendChild(div)
  })
}

tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
}

tabHistory.onclick=()=>{
  historyPage.classList.remove("hidden")
  recordPage.classList.add("hidden")
}

update()

</script>

</body>
</html>
