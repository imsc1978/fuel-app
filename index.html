<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加油紀錄</title>
<script>
/* Chart.js 載入失敗時的錯誤提示 */
window.onerror = function(msg,src,line,col,err){
  if(src && src.includes('chart')){
    document.body.innerHTML='<div style="color:#ff6b6b;padding:20px">Chart.js 載入失敗，請確認網路連線後重新開啟</div>';
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<style>
html{background:#000;}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,sans-serif;
}
.container{
  padding:16px;
  max-width:500px;
  margin:auto;
}
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}
.tab{
  flex:1;
  padding:12px;
  border-radius:12px;
  text-align:center;
  background:#333;
  cursor:pointer;
}
.tab.active{ background:#4da3ff; }
.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
}
/* 表單 grid */
.form-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;
}
.span-2{ grid-column:span 2; }
.span-3{ grid-column:span 3; }
.span-6{ grid-column:span 6; }
label{
  font-size:13px;
  color:#aaa;
  margin-bottom:4px;
  display:block;
}
input,select{
  width:100%;
  min-width:0;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
  box-sizing:border-box;
}
input:focus,select:focus{ outline:2px solid #4da3ff; }
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#4da3ff;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
.hidden{ display:none; }

/* ===== 歷史列表：左滑刪除 ===== */
.item-wrap{
position:relative;
overflow:hidden;
border-bottom:1px solid #2a2a2a;
}
.item-delete-bg{
position:absolute;
right:0;top:0;bottom:0;
width:80px;
background:#ff3b30;
display:flex;align-items:center;justify-content:center;
font-size:13px;color:#fff;font-weight:600;
pointer-events:none;
}
.item{
position:relative;
padding:12px 4px;
font-size:14px;
background:#1c1c1e;
transition:transform 0.18s ease;
cursor:pointer;
touch-action:pan-y;
will-change:transform;
}

/* ===== 修改 Modal ===== */
.modal-overlay{
position:fixed;inset:0;
background:rgba(0,0,0,0.72);
z-index:999;
display:flex;align-items:flex-end;
backdrop-filter:blur(6px);
-webkit-backdrop-filter:blur(6px);
visibility:hidden;
opacity:0;
transition:opacity 0.2s,visibility 0.2s;
}
.modal-overlay.show{
visibility:visible;
opacity:1;
}
.modal{
background:#1c1c1e;
border-radius:20px 20px 0 0;
padding:24px 20px 44px;
width:100%;
max-width:500px;
margin:0 auto;
box-sizing:border-box;
}
.modal-title{
font-size:17px;font-weight:600;
margin-bottom:20px;text-align:center;color:#fff;
}
.modal-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;margin-bottom:10px;
}
.modal-label{
font-size:13px;color:#aaa;
margin-bottom:4px;display:block;
}
.modal input{
width:100%;padding:12px;
border-radius:10px;border:none;
background:#2c2c2e;color:#fff;
font-size:16px;box-sizing:border-box;
}
.modal-hint{
font-size:12px;color:#4da3ff;
margin-bottom:12px;text-align:center;
}
.modal-btns{
display:flex;gap:10px;margin-top:16px;
}
.modal-btns button{
flex:1;padding:14px;border:none;
border-radius:12px;font-size:16px;
cursor:pointer;margin-top:0;
}
.btn-cancel{ background:#333;color:#fff; }
.btn-save-edit{ background:#4da3ff;color:#fff; }

/* ===== 下拉更新 ===== */
.pull-indicator{
text-align:center;
font-size:13px;
color:#aaa;
height:0;
overflow:hidden;
transition:height 0.2s;
display:flex;align-items:center;justify-content:center;
gap:6px;
}
.pull-indicator.pulling{ height:44px; }
.pull-indicator.refreshing{ height:44px; color:#4da3ff; }
.spin{
display:inline-block;
animation:spin 0.8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ===== 歷史格式 ===== */
.item-row1{
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
font-weight:500;
}
.item-date{ color:#fff; }
.item-price-tag{
font-size:12px;
color:#4da3ff;
background:rgba(77,163,255,0.15);
padding:2px 8px;
border-radius:6px;
}
.item-row2{
display:flex;
justify-content:space-between;
margin-top:5px;
font-size:13px;
color:#aaa;
}
.item-row3{
display:flex;
justify-content:space-between;
margin-top:3px;
font-size:12px;
color:#666;
border-top:1px solid #2a2a2a;
padding-top:5px;
margin-top:6px;
}
.item-eff{
color:#51cf66;
font-weight:600;
}
.item-eff.bad{ color:#ff6b6b; }
.item-eff.mid{ color:#ffd43b; }
</style>

</head>

<body>
<div class="container">

<div class="pull-indicator" id="pullRecord">↓ 下拉更新</div>
<h2>⛽ 加油紀錄</h2>

<div class="tabs">
  <div id="tabRecord" class="tab active">紀錄</div>
  <div id="tabHistory" class="tab">歷史</div>
</div>

<!-- ===== 紀錄頁 ===== -->

<div id="recordPage">
  <div class="card">
    <div class="form-grid">
      <div class="span-2">
        <label>油品來源</label>
        <select id="source">
          <option value="中油">中油</option>
          <option value="台塑">台塑</option>
        </select>
      </div><div class="span-2">
        <label>油種</label>
        <select id="type">
          <option value="92">92</option>
          <option value="95" selected>95</option>
          <option value="98">98</option>
          <option value="diesel">柴油</option>
        </select>
      </div><div class="span-2">
        <label>油價 (元/L)</label>
        <input id="price" type="number" step="0.1">
      </div><div class="span-2">
        <label>金額 (元)</label>
        <input id="amount" type="text" inputmode="decimal" pattern="[0-9.]*" oninput="autoCalcLiter()">
      </div><div class="span-2">
        <label>加油量 (L)</label>
        <input id="liter" type="text" inputmode="decimal" pattern="[0-9.]*" placeholder="自動換算">
      </div><div class="span-2">
        <label>總里程 (km)</label>
        <input id="mileage" type="text" inputmode="decimal" pattern="[0-9.]*">
      </div>
    </div>
    <button id="saveBtn">儲存</button>
  </div>

  <div class="card">
    距離：<span id="distance">--</span> km　
    油耗：<span id="efficiency">--</span> km/L
  </div>

  <div class="card">
    <div id="chartControls" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <button id="prevBtn" onclick="shiftChart(-1)" style="width:auto;padding:6px 14px;margin:0;font-size:13px;border-radius:8px;background:#333;">◀</button>
      <span id="chartLabel" style="font-size:13px;color:#aaa;"></span>
      <button id="nextBtn" onclick="shiftChart(1)" style="width:auto;padding:6px 14px;margin:0;font-size:13px;border-radius:8px;background:#333;">▶</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px;">
      <button id="modeWeek" onclick="setChartMode('week')" style="flex:1;padding:7px;margin:0;font-size:12px;border-radius:8px;background:#4da3ff;">週</button>
      <button id="modeMonth" onclick="setChartMode('month')" style="flex:1;padding:7px;margin:0;font-size:12px;border-radius:8px;background:#333;">月</button>
    </div>
    <canvas id="chart"></canvas>
  </div>
</div>

<!-- ===== 歷史頁 ===== -->

<div id="historyPage" class="hidden">
  <div class="pull-indicator" id="pullHistory">↓ 下拉更新</div>
  <div id="historyList" class="card"></div>
</div>

</div><!-- /container -->

<!-- ===== 修改 Modal ===== -->

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">修改紀錄</div>
    <div class="modal-grid">
      <div>
        <span class="modal-label">金額 (元)</span>
        <input id="editAmount" type="tel" inputmode="numeric" oninput="autoCalcEditLiter()">
      </div>
      <div>
        <span class="modal-label">加油量 (L)</span>
        <input id="editLiter" type="text" inputmode="decimal" pattern="[0-9.]*">
      </div>
    </div>
    <div class="modal-grid">
      <div>
        <span class="modal-label">油價 (元/L)</span>
        <input id="editPrice" type="number" step="0.1" oninput="autoCalcEditLiter()">
      </div>
      <div>
        <span class="modal-label">總里程 (km)</span>
        <input id="editMileage" type="text" inputmode="decimal" pattern="[0-9.]*">
      </div>
    </div>
    <div class="modal-hint" id="editHint"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save-edit" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<script>

/* ===== CONFIG ===== */
const KEY = "fuel";

/* ===== 油價 ===== */
const priceMap = {
  "中油": { "92":32.4, "95":33.9, "98":35.9, "diesel":31.0 },
  "台塑": { "92":32.2, "95":33.7, "98":35.7, "diesel":30.8 }
};

/* ===== 元素 ===== */
const sourceEl    = document.getElementById("source");
const typeEl      = document.getElementById("type");
const priceEl     = document.getElementById("price");
const amountEl    = document.getElementById("amount");
const literEl     = document.getElementById("liter");
const mileageEl   = document.getElementById("mileage");
const distanceEl  = document.getElementById("distance");
const efficiencyEl= document.getElementById("efficiency");
const chartEl     = document.getElementById("chart");
const tabRecord   = document.getElementById("tabRecord");
const tabHistory  = document.getElementById("tabHistory");
const recordPage  = document.getElementById("recordPage");
const historyPage = document.getElementById("historyPage");
const editModal   = document.getElementById("editModal");

/* ===== 油價自動填入 ===== */
function updatePrice(){
  const s = sourceEl.value, t = typeEl.value;
  if(priceMap[s]?.[t]) priceEl.value = priceMap[s][t];
  autoCalcLiter();
}

/* ===== 金額→加油量自動換算（紀錄頁） ===== */
function autoCalcLiter(){
  const amount = parseFloat(amountEl.value);
  const price  = parseFloat(priceEl.value);
  if(amount > 0 && price > 0){
    literEl.value = (amount / price).toFixed(2);
  } else {
    literEl.value = "";
  }
}

/* ===== DATA ===== */
function getData(){ return JSON.parse(localStorage.getItem(KEY)||"[]"); }
function saveData(d){ localStorage.setItem(KEY, JSON.stringify(d)); }

/* ===== 計算距離與油耗（依前後兩筆里程 & 公升數） ===== */
function calcEff(last, now){
  if(!last) return { distance:0, eff:0 };
  const distance = now.mileage - last.mileage;
  if(distance <= 0 || !now.liter) return { distance:0, eff:0 };
  return { distance, eff: distance / now.liter };
}

/* ===== 重算全部油耗（修改後連動） ===== */
function recalcAll(data){
  for(let i = 0; i < data.length; i++){
    const r = calcEff(data[i-1] || null, data[i]);
    data[i].distance = r.distance;
    data[i].eff = r.eff;
  }
  return data;
}

/* ===== UI 顯示 ===== */
function updateUI(d, e){
  distanceEl.textContent  = d ? d.toFixed(0) : "--";
  efficiencyEl.textContent= e ? e.toFixed(2) : "--";
}

/* ===== 儲存（紀錄頁） ===== */
document.getElementById("saveBtn").onclick = ()=>{
  const amount  = parseFloat(amountEl.value);
  const mileage = parseFloat(mileageEl.value);
  const price   = parseFloat(priceEl.value);
  let   liter   = parseFloat(literEl.value);

  if(!amount || !mileage || !price){ alert("請輸入完整資料"); return; }
  if(!liter || isNaN(liter)) liter = amount / price;

  let data = getData();
  const last = data[data.length - 1];

  const record = {
    id: Date.now(),
    date: (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })(),
    amount, mileage, price,
    liter: parseFloat(liter.toFixed(2))
  };

  const r = calcEff(last, record);
  record.distance = r.distance;
  record.eff = r.eff;

  data.push(record);
  saveData(data);

  updateUI(r.distance, r.eff);
  drawChart();

  amountEl.value = "";
  literEl.value  = "";
  mileageEl.value = record.mileage;
  setTimeout(()=>amountEl.focus(), 50);
};

/* ===== CHART ===== */
const totalLabelPlugin = {
  id:"totalLabel",
  afterDatasetsDraw(chart){
    const { ctx, data, scales:{ x, y } } = chart;
    const totals = {};
    data.datasets.forEach(ds=>{
      if(ds.type !== "bar") return;
      ds.data.forEach((v,i)=>{ totals[i] = (totals[i]||0)+(v||0); });
    });
    ctx.save();
    ctx.fillStyle="#fff";
    ctx.font="11px -apple-system,sans-serif";
    ctx.textAlign="center";
    Object.entries(totals).forEach(([i,total])=>{
      if(total<=0) return;
      ctx.fillText(total.toFixed(1)+"L", x.getPixelForValue(Number(i)), y.getPixelForValue(total)-6);
    });
    ctx.restore();
  }
};

/* 本地日期工具 */
function localDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mmdd(d){ return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

let chart;
let chartMode = "week"; // "week" | "month"
let chartOffset = 0;   // 0=本週/本月, -1=上週/上月

function setChartMode(mode){
  chartMode = mode;
  chartOffset = 0;
  document.getElementById("modeWeek").style.background  = mode==="week" ? "#4da3ff" : "#333";
  document.getElementById("modeMonth").style.background = mode==="month" ? "#4da3ff" : "#333";
  drawChart();
}

function shiftChart(dir){
  chartOffset += dir;
  // 不能往未來移
  if(chartOffset > 0) chartOffset = 0;
  drawChart();
}

function drawChart(){
  if(typeof Chart === "undefined"){
    document.getElementById("chart").insertAdjacentHTML("afterend","<div style='color:#ff6b6b;font-size:13px;margin-top:8px'>⚠️ 圖表需要網路連線才能顯示</div>");
    return;
  }
  const allData = getData();
  if(chart) chart.destroy();

  const now = new Date();
  let labels = [], startDate, endDate;

  if(chartMode === "week"){
    // 找本週一，再加 offset*7
    const day = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() + (day===0?-6:1-day) + chartOffset*7);
    startDate = monday;
    for(let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      labels.push(mmdd(d));
    }
    endDate = new Date(monday); endDate.setDate(monday.getDate()+6);
    const s=mmdd(monday), e=mmdd(endDate);
    document.getElementById("chartLabel").textContent = s+" ～ "+e;
  } else {
    // 月模式
    const y = now.getFullYear(), m = now.getMonth() + chartOffset;
    const base = new Date(y, m, 1);
    const daysInMonth = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
    startDate = base;
    for(let i=1;i<=daysInMonth;i++){
      const d = new Date(base.getFullYear(), base.getMonth(), i);
      labels.push(mmdd(d));
    }
    document.getElementById("chartLabel").textContent = base.getFullYear()+"年"+(base.getMonth()+1)+"月";
  }

  // ▶ 按鈕：本週/本月不能再往右
  document.getElementById("nextBtn").style.opacity = chartOffset >= 0 ? "0.3" : "1";

  // 建立 dateMap（用 MM-DD 對應）
  const dateMap = {};
  labels.forEach(l=>{ dateMap[l]=[]; });

  allData.forEach(d=>{
    const key = d.date.slice(5,10); // MM-DD
    if(dateMap[key] !== undefined) dateMap[key].push(d);
  });

  const datasets=[];
  const colors=["#4da3ff","#ff6b6b","#51cf66","#ffd43b","#cc5de8","#ff922b","#20c997"];
  let ci=0;
  labels.forEach(date=>{
    dateMap[date].forEach(item=>{
      const liter = item.liter || (item.amount/item.price);
      datasets.push({
        type:"bar",
        data:labels.map(d=>d===date?liter:0),
        backgroundColor:colors[ci%colors.length],
        stack:"fuel", label:item.date
      });
      ci++;
    });
  });

  /* [修正] 折線：同一天多筆取平均eff，確保有資料就顯示 */
  const effByDate={}, effCount={};
  allData.forEach(d=>{
    const k=d.date.slice(5,10);
    if(d.eff && d.eff>0){
      effByDate[k]=(effByDate[k]||0)+d.eff;
      effCount[k]=(effCount[k]||0)+1;
    }
  });
  // 取平均
  Object.keys(effByDate).forEach(k=>{ effByDate[k]=effByDate[k]/effCount[k]; });

  const effValues = labels.map(d=>effByDate[d]||null);
  const validEff = effValues.filter(v=>v!==null);
  const minEff = validEff.length ? Math.min(...validEff)*0.95 : 0;
  const maxEff = validEff.length ? Math.max(...validEff)*1.05 : 50;

  datasets.push({
    type:"line",
    data:effValues,
    borderColor:"#fff",
    backgroundColor:"rgba(255,255,255,0.1)",
    borderWidth:2,
    tension:0.3,
    pointRadius:4,
    pointBackgroundColor:"#fff",
    spanGaps:true,
    yAxisID:"y1",
    label:"油耗(km/L)",
    order:-1
  });

  chart = new Chart(chartEl,{
    data:{ labels, datasets },
    options:{
      responsive:true,
      animation:{ duration:300 },
      plugins:{ legend:{display:false} },
      scales:{
        x:{
          stacked:true,
          ticks:{ color:"#aaa", maxRotation:45, font:{size:10} },
          grid:{ color:"#2a2a2a" }
        },
        y:{
          stacked:true,
          title:{display:true,text:"加油量(L)",color:"#aaa"},
          ticks:{color:"#aaa"},
          grid:{color:"#2a2a2a"}
        },
        y1:{
          position:"right",
          min: minEff,
          max: maxEff,
          grid:{drawOnChartArea:false},
          title:{display:true,text:"km/L",color:"#aaa"},
          ticks:{color:"#aaa", callback:v=>v.toFixed(1)}
        }
      }
    },
    plugins:[totalLabelPlugin]
  });
}

/* ===== 歷史頁：左滑刪除 + 點擊修改 ===== */
function renderHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML="";

  const rawData = getData();
  if(!rawData.length){
    list.innerHTML="<div style='color:#aaa;text-align:center;padding:20px'>還沒有紀錄</div>";
    return;
  }

  // 反轉顯示，保留原始 index 對應
  const reversed = rawData.map((d,i)=>({...d, _origIdx:i})).reverse();

  // 計算平均油耗（排除第一筆 eff=0）
  const validEffs = rawData.map(d=>d.eff).filter(e=>e&&e>0);
  const avgEff = validEffs.length ? validEffs.reduce((a,b)=>a+b,0)/validEffs.length : 0;

  reversed.forEach(d=>{
    const liter = d.liter ? d.liter.toFixed(2) : (d.price?(d.amount/d.price).toFixed(2):"--");
    const eff   = d.eff && d.eff > 0 ? d.eff.toFixed(2) : null;
    // 與平均比較決定顏色
    let effColor = "#666";
    if(eff){
      const v = parseFloat(eff);
      if(avgEff > 0){
        effColor = v >= avgEff ? "#ff6b6b" : "#51cf66"; // 高於平均→費油→紅；低於平均→省油→綠
      } else {
        effColor = v>=30?"#51cf66":v>=20?"#ffd43b":"#ff6b6b";
      }
    }
    // 距離（本筆里程 - 前筆里程）
    const distStr = d.distance && d.distance > 0 ? d.distance.toFixed(0)+" km" : "--";

    const wrap = document.createElement("div");
    wrap.className="item-wrap";

    wrap.innerHTML=`
      <div class="item-delete-bg">刪除</div>
      <div class="item" data-idx="${d._origIdx}">
        <div class="item-row1">
          <span class="item-date">${d.date}</span>
          <span class="item-price-tag">${d.price} 元/L</span>
        </div>
        <div class="item-row2">
          <span>💰 $${d.amount}</span>
          <span>⛽ ${liter} L</span>
          <span>📏 ${distStr}</span>
        </div>
        <div class="item-row3">
          <span style="color:#aaa">總里程 ${Number(d.mileage).toLocaleString()} km</span>
          <span style="color:${effColor};font-weight:600">油耗 ${eff ? eff+" km/L" : "--"}</span>
        </div>
      </div>`;

    list.appendChild(wrap);

    const item = wrap.querySelector(".item");
    addSwipeDelete(wrap, item, d._origIdx);

    // 點擊修改
    item.addEventListener("click", ()=>{
      if(item._swiped) return; // 左滑中不觸發
      openModal(d._origIdx);
    });
  });
}

/* ===== 左滑刪除手勢 ===== */
function addSwipeDelete(wrap, item, origIdx){
  let startX=0, curX=0, swiped=false;
  item._swiped = false;

  item.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
    curX   = startX;
    item.style.transition="none";
  }, {passive:true});

  item.addEventListener("touchmove", e=>{
    curX = e.touches[0].clientX;
    const dx = Math.min(0, curX - startX);
    if(dx < 0) item.style.transform=`translateX(${Math.max(dx,-80)}px)`;
  }, {passive:true});

  item.addEventListener("touchend", ()=>{
    const dx = curX - startX;
    item.style.transition="transform 0.18s ease";
    if(dx < -50){
      item.style.transform="translateX(-80px)";
      item._swiped = true;
      // 點刪除背景確認刪除
      wrap.querySelector(".item-delete-bg").style.pointerEvents="auto";
      wrap.querySelector(".item-delete-bg").onclick=()=>deleteRecord(origIdx);
    } else {
      item.style.transform="translateX(0)";
      item._swiped = false;
    }
  });
}

/* ===== 刪除 ===== */
function deleteRecord(origIdx){
  if(!confirm("確定刪除這筆紀錄？")) return;
  let data = getData();
  data.splice(origIdx, 1);
  data = recalcAll(data);
  saveData(data);
  renderHistory();
  drawChart();
}

/* ===== 修改 Modal ===== */
let editIdx = -1;

function openModal(origIdx){
  editIdx = origIdx;
  const d = getData()[origIdx];
  document.getElementById("editAmount").value  = d.amount;
  document.getElementById("editLiter").value   = d.liter || (d.amount/d.price).toFixed(2);
  document.getElementById("editPrice").value   = d.price;
  document.getElementById("editMileage").value = d.mileage;
  document.getElementById("editHint").textContent = d.date;
  editModal.classList.add("show");
}

function closeModal(){
  editModal.classList.remove("show");
  editIdx = -1;
}

/* 修改 modal 的加油量自動換算 */
function autoCalcEditLiter(){
  const amount = parseFloat(document.getElementById("editAmount").value);
  const price  = parseFloat(document.getElementById("editPrice").value);
  if(amount>0 && price>0){
    document.getElementById("editLiter").value = (amount/price).toFixed(2);
  }
}

function saveEdit(){
  if(editIdx < 0) return;
  const amount  = parseFloat(document.getElementById("editAmount").value);
  const liter   = parseFloat(document.getElementById("editLiter").value);
  const price   = parseFloat(document.getElementById("editPrice").value);
  const mileage = parseFloat(document.getElementById("editMileage").value);

  if(!amount || !liter || !price || !mileage){ alert("請輸入完整資料"); return; }

  let data = getData();
  data[editIdx] = { ...data[editIdx], amount, liter, price, mileage };
  data = recalcAll(data);
  saveData(data);

  closeModal();
  renderHistory();
  drawChart();

  // 更新主頁顯示
  const last = data[data.length-1];
  updateUI(last?.distance||0, last?.eff||0);
}

// 點 overlay 關閉
editModal.addEventListener("click", e=>{ if(e.target===editModal) closeModal(); });

/* ===== Tabs ===== */
tabRecord.onclick=()=>{
  tabRecord.classList.add("active");
  tabHistory.classList.remove("active");
  recordPage.classList.remove("hidden");
  historyPage.classList.add("hidden");
};

tabHistory.onclick=()=>{
  tabHistory.classList.add("active");
  tabRecord.classList.remove("active");
  recordPage.classList.add("hidden");
  historyPage.classList.remove("hidden");
  renderHistory();
};

/* ===== 下拉更新 ===== */
function setupPullRefresh(pullElId, onRefresh){
  const el = document.getElementById(pullElId);
  let startY=0, pulling=false, threshold=60;

  document.addEventListener("touchstart", e=>{
    // 只有捲到頂才觸發
    if(window.scrollY > 10) return;
    startY = e.touches[0].clientY;
    pulling = true;
  }, {passive:true});

  document.addEventListener("touchmove", e=>{
    if(!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if(dy > 10 && window.scrollY <= 0){
      el.textContent = dy > threshold ? "↑ 放開更新" : "↓ 繼續下拉";
      el.classList.add("pulling");
      el.classList.remove("refreshing");
    }
  }, {passive:true});

  document.addEventListener("touchend", e=>{
    if(!pulling) return;
    pulling = false;
    const dy = e.changedTouches[0].clientY - startY;
    if(dy > threshold && window.scrollY <= 0){
      el.innerHTML = '<span class="spin">⟳</span> 更新中…';
      el.classList.add("refreshing");
      el.classList.remove("pulling");
      setTimeout(()=>{
        onRefresh();
        el.classList.remove("refreshing","pulling");
        el.textContent = "↓ 下拉更新";
        el.style.height="0";
        setTimeout(()=>{ el.classList.remove("pulling","refreshing"); }, 300);
      }, 600);
    } else {
      el.classList.remove("pulling","refreshing");
      el.textContent = "↓ 下拉更新";
    }
  }, {passive:true});
}

/* ===== INIT ===== */
function init(){
  updatePrice();
  drawChart();
  const data = getData();
  if(data.length) mileageEl.value = data[data.length-1].mileage;
}

sourceEl.onchange = updatePrice;
typeEl.onchange   = updatePrice;
priceEl.oninput   = autoCalcLiter;

init();

// 主頁下拉更新
setupPullRefresh("pullRecord", ()=>{
  drawChart();
  const data = getData();
  if(data.length){ const last=data[data.length-1]; updateUI(last.distance||0, last.eff||0); }
});

// 歷史頁下拉更新
setupPullRefresh("pullHistory", ()=>{ renderHistory(); });
</script>
