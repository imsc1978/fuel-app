<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>油耗管理</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont;
    background: #0b0b0b;
    color: #fff;
    margin: 0;
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 420px;
    padding: 16px;
}

/* 卡片 */
.card {
    background: linear-gradient(180deg,#1c1c1e,#151515);
    padding: 16px;
    border-radius: 18px;
    margin-top: 14px;
}

/* 輸入 */
input, select {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    background: #2c2c2e;
    color: white;
    font-size: 16px;
}

/* 按鈕 */
button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg,#00c6ff,#0072ff);
    color: white;
    font-size: 16px;
}

/* 圖表區 */
.chartWrap {
    position: relative;
}

.chartOverlay {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 14px;
    text-align: right;
    color: #aaa;
}

.big {
    font-size: 22px;
    color: #fff;
}
</style>
</head>

<body>
<div class="app">

<h2>⛽ 加油紀錄</h2>

<div class="card">

    <!-- 油品來源 -->
    <select id="brand" onchange="updatePrice()">
        <option value="cpc">中油</option>
        <option value="fpcc">台塑</option>
    </select>

    <!-- 油種 -->
    <select id="type" onchange="updatePrice()">
        <option value="92">92</option>
        <option value="95" selected>95</option>
        <option value="diesel">柴油</option>
    </select>

    <div id="priceText">油價：31.2 元/L</div>

    <input id="money" type="number" inputmode="decimal" placeholder="輸入金額">
    <input id="km" type="number" inputmode="decimal" placeholder="輸入里程">

    <button onclick="save()">儲存</button>
</div>

<div class="card">
    <div>距離： <span id="distance">0</span> km</div>
    <div>油耗： <span id="consumption">-</span> km/L</div>
</div>

<div class="card chartWrap">
    <div class="chartOverlay">
        平均油耗<br>
        <span class="big" id="weekAvg">- km/L</span>
    </div>
    <canvas id="chart"></canvas>
</div>

</div>

<script>
let records = JSON.parse(localStorage.getItem("fuelRecords") || "[]");

const priceTable = {
    cpc: { "92": 29.2, "95": 31.2, "diesel": 27.5 },
    fpcc:{ "92": 29.0, "95": 31.0, "diesel": 27.3 }
};

let price = 31.2;

// 👉 更新油價
function updatePrice(){
    let brand = document.getElementById("brand").value;
    let type = document.getElementById("type").value;

    price = priceTable[brand][type];
    document.getElementById("priceText").innerText = `油價：${price} 元/L`;
}

// 👉 今日
function getToday(){
    return new Date().toISOString().split("T")[0];
}

// 👉 週資料
function getWeek(){
    let today = new Date();
    let day = today.getDay();

    let monday = new Date(today);
    let diff = day === 0 ? -6 : 1 - day;
    monday.setDate(today.getDate() + diff);

    let arr = [];

    for(let i=0;i<7;i++){
        let d = new Date(monday);
        d.setDate(monday.getDate()+i);

        let ds = d.toISOString().split("T")[0];

        let same = records.filter(r=>r.date===ds);

        let dist=0,val=0;
        same.forEach(r=>{
            dist+=r.distance;
            val+=r.value;
        });

        let avg = val>0 ? dist/val : null;

        arr.push({date:ds,value:avg});
    }
    return arr;
}

// 👉 儲存
function save(){
    let m = parseFloat(money.value);
    let k = parseFloat(km.value);
    if(!m||!k)return;

    let liter = m/price;

    let last = records.length?records[records.length-1].km:k;
    let dist = k-last;

    records.push({
        date:getToday(),
        km:k,
        distance:dist,
        value:liter
    });

    localStorage.setItem("fuelRecords",JSON.stringify(records));

    update();
}

// 👉 更新畫面
let chart;

function update(){

    if(records.length){
        let last=records[records.length-1];
        distance.innerText=Math.round(last.distance);
        consumption.innerText=(last.distance/last.value).toFixed(2);
    }

    let week=getWeek();

    let labels=week.map(d=>{
        let dt=new Date(d.date);
        let w=["日","一","二","三","四","五","六"][dt.getDay()];
        return d.date===getToday()
            ? "👉 "+w
            : w;
    });

    let data=week.map(d=>d.value);

    // 平均
    let valid=data.filter(v=>v);
    let avg=valid.length?(valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(2):"-";
    weekAvg.innerText=avg+" km/L";

    render(labels,data);
}

// 👉 畫圖
function render(labels,data){
    if(chart)chart.destroy();

    chart=new Chart(chartEl,{
        type:"bar",
        data:{
            labels:labels,
            datasets:[{
                data:data,
                backgroundColor:"#4da3ff",
                borderRadius:6
            }]
        },
        options:{
            plugins:{legend:{display:false}},
            scales:{
                y:{beginAtZero:true}
            }
        }
    });
}

const chartEl=document.getElementById("chart");

update();
updatePrice();
</script>

</body>
</html>
