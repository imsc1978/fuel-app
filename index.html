<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>加油紀錄</title>

<style>
body{
  background:#000;
  color:white;
  font-family:sans-serif;
  margin:0;
  padding:20px;
}

h1{
  margin-bottom:20px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  padding:12px;
  border-radius:12px;
  background:#333;
  text-align:center;
}

.tab.active{
  background:#4da3ff;
}

.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:16px;
  margin-bottom:20px;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#4da3ff;
  color:white;
  font-size:16px;
}

.hidden{
  display:none;
}

/* ===== 歷史 ===== */
.history-item{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  margin:10px 0;
}

.item-content{
  background:#1c1c1e;
  padding:16px;
  transition:0.25s;
}

.delete-btn{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:80px;
  background:#ff3b30;
  display:flex;
  align-items:center;
  justify-content:center;
}

.history-item.show .item-content{
  transform:translateX(-80px);
}

/* ===== ActionSheet ===== */
.action-sheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,0.4);
  display:flex;
  align-items:flex-end;
}

.sheet{
  width:100%;
  background:#111;
  border-radius:16px 16px 0 0;
  padding:12px;
}

.sheet button{
  background:#222;
  margin:6px 0;
}
</style>
</head>

<body>

<h1>⛽ 加油紀錄</h1>

<div class="tabs">
  <div id="tabRecord" class="tab active">紀錄</div>
  <div id="tabHistory" class="tab">歷史</div>
</div>

<!-- ===== 紀錄頁 ===== -->
<div id="recordPage" class="card">

  <div class="row">
    <input id="amount" type="number" placeholder="金額">
    <input id="km" type="number" placeholder="總里程">
  </div>

  <button onclick="saveRecord()">儲存</button>

</div>

<!-- ===== 歷史頁 ===== -->
<div id="historyPage" class="card hidden">
  <div id="historyList"></div>
</div>

<script>
const KEY="fuel"

// ===== TAB =====
const tabRecord=document.getElementById("tabRecord")
const tabHistory=document.getElementById("tabHistory")
const recordPage=document.getElementById("recordPage")
const historyPage=document.getElementById("historyPage")

tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
  tabRecord.classList.add("active")
  tabHistory.classList.remove("active")
}

tabHistory.onclick=()=>{
  recordPage.classList.add("hidden")
  historyPage.classList.remove("hidden")
  tabHistory.classList.add("active")
  tabRecord.classList.remove("active")
  renderHistory()
}

// ===== 資料 =====
function load(){
  return JSON.parse(localStorage.getItem(KEY)||"[]")
}

function save(data){
  localStorage.setItem(KEY,JSON.stringify(data))
}

// ===== 儲存 =====
function saveRecord(){

  const amount=Number(document.getElementById("amount").value)
  const km=Number(document.getElementById("km").value)

  if(!amount||!km) return alert("請輸入完整")

  const data=load()

  data.push({
    id:Date.now()+"_"+Math.random(),
    amount,
    km,
    time:Date.now(),
    date:new Date().toISOString().slice(0,10)
  })

  save(data)

  document.getElementById("amount").value=""
  document.getElementById("km").value=""

  alert("已儲存")
}

// ===== 歷史 =====
function renderHistory(){

  const list=document.getElementById("historyList")
  const data=load().sort((a,b)=>b.time-a.time)

  list.innerHTML=""

  data.forEach(item=>{

    const div=document.createElement("div")
    div.className="history-item"

    div.innerHTML=`
      <div class="delete-btn">刪除</div>
      <div class="item-content">
        ${item.date} | ${item.km} km
      </div>
    `

    const content=div.querySelector(".item-content")
    const del=div.querySelector(".delete-btn")

    let startX=0

    content.addEventListener("touchstart",e=>{
      startX=e.touches[0].clientX
    })

    content.addEventListener("touchmove",e=>{
      let diff=e.touches[0].clientX-startX

      if(diff<-30) div.classList.add("show")
      if(diff>30) div.classList.remove("show")
    })

    content.onclick=()=>openSheet(item.id)
    del.onclick=()=>remove(item.id)

    list.appendChild(div)
  })
}

// ===== 刪除 =====
function remove(id){
  let data=load()
  data=data.filter(i=>i.id!==id)
  save(data)
  renderHistory()
}

// ===== 操作選單 =====
function openSheet(id){

  const sheet=document.createElement("div")
  sheet.className="action-sheet"

  sheet.innerHTML=`
    <div class="sheet">
      <button onclick="editKm('${id}')">修改里程</button>
      <button onclick="editAmount('${id}')">修改金額</button>
      <button onclick="closeSheet()">取消</button>
    </div>
  `

  document.body.appendChild(sheet)
}

function closeSheet(){
  document.querySelector(".action-sheet")?.remove()
}

// ===== 編輯 =====
function editKm(id){
  closeSheet()

  const data=load()
  const item=data.find(i=>i.id===id)

  let v=prompt("里程",item.km)
  if(v===null) return

  item.km=Number(v)
  save(data)
  renderHistory()
}

function editAmount(id){
  closeSheet()

  const data=load()
  const item=data.find(i=>i.id===id)

  let v=prompt("金額",item.amount)
  if(v===null) return

  item.amount=Number(v)
  save(data)
  renderHistory()
}
</script>

</body>
</html>
