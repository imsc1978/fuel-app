<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:20px}
.card{background:#1c1c1e;padding:16px;border-radius:16px;margin-bottom:20px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.label{font-size:12px;color:#aaa;margin-bottom:4px}
input,select{padding:12px;border:none;border-radius:10px;background:#2c2c2e;color:#fff;width:100%}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#4facfe;color:#fff;margin-top:10px}
.hidden{display:none}
</style>
</head>

<body>

<h2>⛽ 加油紀錄</h2>

<div class="card">

<div class="row">
<div>
<div class="label">油品來源</div>
<select id="source">
<option>中油</option>
<option>台塑</option>
</select>
</div>

<div>
<div class="label">油種</div>
<select id="type">
<option>92</option>
<option selected>95</option>
<option>98</option>
<option>柴油</option>
</select>
</div>

<div>
<div class="label">油價</div>
<input id="price">
</div>
</div>

<div class="row" style="margin-top:10px">
<div>
<div class="label">金額</div>
<input id="amount">
</div>

<div>
<div class="label">總里程</div>
<input id="km">
</div>
</div>

<button onclick="save()">儲存</button>

</div>

<div class="card" id="result">-</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<script>

let data = JSON.parse(localStorage.getItem("fuel")||"[]")

/* ===== 自動油價 ===== */
const priceMap={92:30,95:31.2,98:33,柴油:28}
type.onchange=()=>price.value=priceMap[type.value]
price.value=priceMap[type.value]

/* ===== 儲存 ===== */
function save(){

  const amountVal=parseFloat(amount.value)
  const kmVal=parseFloat(km.value)
  const priceVal=parseFloat(price.value)

  if(!amountVal||!kmVal||!priceVal)return alert("輸入完整")

  const last=data[data.length-1]

  let distance=0
  if(last){
    distance=kmVal-last.km
    if(distance<0)return alert("里程錯誤")
  }

  const liter=amountVal/priceVal
  const avg=distance>0?distance/liter:0

  const item={
    date:new Date().toISOString().slice(0,10),
    km:kmVal,
    avg
  }

  data.push(item)
  localStorage.setItem("fuel",JSON.stringify(data))

  update()
}

/* ===== 更新 ===== */
function update(){

  const last=data[data.length-1]

  if(!last){
    result.innerHTML="-"
    return
  }

  result.innerHTML=`距離:${last.km}km<br>油耗:${last.avg.toFixed(2)}`

  drawChart()
}

/* ===== 圖表（同天堆疊）===== */
let chart

function drawChart(){

  if(chart)chart.destroy()

  if(!data.length)return

  const grouped={}

  data.forEach(i=>{
    if(!grouped[i.date])grouped[i.date]=[]
    grouped[i.date].push(i.avg)
  })

  const labels=Object.keys(grouped)

  const max=Math.max(...Object.values(grouped).map(a=>a.length))

  const datasets=[]

  for(let i=0;i<max;i++){
    datasets.push({
      data:labels.map(d=>grouped[d][i]||0),
      backgroundColor:`hsl(${i*60},70%,60%)`,
      stack:"a"
    })
  }

  chart=new Chart(chart,{
    type:"bar",
    data:{labels,datasets},
    options:{
      plugins:{legend:false},
      scales:{x:{stacked:true},y:{stacked:true}}
    }
  })
}

update()

</script>

</body>
</html>
