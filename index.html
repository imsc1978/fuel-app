<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>油耗管理</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont;
    background: #0b0b0b;
    color: #fff;
    margin: 0;
    padding: 16px;
}

h1 {
    font-size: 22px;
    margin-bottom: 10px;
}

/* 卡片 */
.card {
    background: linear-gradient(180deg,#1c1c1e,#151515);
    padding: 16px;
    border-radius: 18px;
    margin-top: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* 輸入 */
input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    background: #2c2c2e;
    color: white;
    font-size: 16px;
    box-sizing: border-box;
}

/* 按鈕 */
button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    background: linear-gradient(90deg,#00c6ff,#0072ff);
    color: white;
    transition: 0.2s;
}

button:active {
    transform: scale(0.97);
}

/* 主資訊 */
.mainStat {
    text-align: center;
}

.big {
    font-size: 40px;
    font-weight: bold;
}

.sub {
    color: #aaa;
}

/* 圖表縮小 */
canvas {
    height: 200px !important;
}
</style>
</head>

<body>

<h1>⛽ 加油紀錄</h1>

<!-- 主卡 -->
<div class="card mainStat">
    <div class="sub">本週平均油耗</div>
    <div class="big" id="weekAvg">- km/L</div>
</div>

<!-- 輸入 -->
<div class="card">
    <div>油價：31.2 元/L</div>
    <input id="money" type="number" inputmode="decimal" placeholder="輸入金額">
    <input id="km" type="number" inputmode="decimal" placeholder="輸入里程">
    <button onclick="save()">儲存</button>
</div>

<!-- 即時 -->
<div class="card">
    <div>距離</div>
    <div class="big" id="distance">0 km</div>
    <div class="sub">平均油耗</div>
    <div class="big" id="consumption">- km/L</div>
</div>

<!-- 圖表 -->
<div class="card">
    <canvas id="chart"></canvas>
</div>

<script>
const price = 31.2;
let records = JSON.parse(localStorage.getItem("fuelRecords") || "[]");

function getToday() {
    return new Date().toISOString().split("T")[0];
}

function getWeekDays() {
    let today = new Date();
    let day = today.getDay();

    let monday = new Date(today);
    let diff = day === 0 ? -6 : 1 - day;
    monday.setDate(today.getDate() + diff);

    let result = [];

    for (let i = 0; i < 7; i++) {
        let d = new Date(monday);
        d.setDate(monday.getDate() + i);

        let dateStr = d.toISOString().split("T")[0];

        let sameDay = records.filter(r => r.date === dateStr);

        let totalValue = 0;
        let totalDist = 0;

        sameDay.forEach(r => {
            totalValue += r.value;
            totalDist += r.distance;
        });

        let avg = totalValue > 0 ? totalDist / totalValue : null;

        result.push({
            date: dateStr,
            value: avg
        });
    }

    return result;
}

function save() {
    let money = parseFloat(document.getElementById("money").value);
    let km = parseFloat(document.getElementById("km").value);

    if (!money || !km) return;

    let liters = money / price;

    let last = records.length > 0 ? records[records.length - 1].km : km;
    let distance = km - last;

    let today = getToday();

    records.push({
        date: today,
        km: km,
        distance: distance,
        value: liters
    });

    localStorage.setItem("fuelRecords", JSON.stringify(records));

    update();
}

let chart;

function update() {

    // 即時數據
    if (records.length > 0) {
        let last = records[records.length - 1];
        document.getElementById("distance").innerText = Math.round(last.distance) + " km";

        let cons = last.distance / last.value;
        document.getElementById("consumption").innerText = cons.toFixed(2) + " km/L";
    }

    let week = getWeekDays();

    let labels = week.map(d => {
        let date = new Date(d.date);
        let day = ["日","一","二","三","四","五","六"][date.getDay()];
        let label = day + "（" + (date.getMonth()+1) + "/" + date.getDate() + "）";
        return d.date === getToday() ? "👉 " + label : label;
    });

    let data = week.map(d => d.value);

    // 👉 本週平均
    let valid = data.filter(v => v);
    let avg = valid.length ? (valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(2) : "-";
    document.getElementById("weekAvg").innerText = avg + " km/L";

    renderChart(labels, data);
}

function renderChart(labels, data) {
    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "km/L",
                data: data,
                borderRadius: 8,
                backgroundColor: "#4da3ff"
            }]
        },
        options: {
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { color: "#aaa" }
                },
                x: {
                    ticks: { color: "#aaa" }
                }
            }
        }
    });
}

update();
</script>

</body>
</html>
