<!DOCTYPE html>
<html lang="zh">
<head>

<style>

button{
  width:100%;
  padding:14px;

  border-radius:12px;

.stat{font-size:28px;font-weight:bold;}

</head>

<body>

<div class="container">

<h1>⛽ 加油紀錄</h1>

<div class="card">

<div class="row">
<select id="brand">
<option>中油</option>
<option>台塑</option>
</select>

<select id="type">
<option value="92">92</option>
<option value="95" selected>95</option>
<option value="98">98</option>
<option value="diesel">柴油</option>
</select>

<input id="price" type="tel" inputmode="decimal" value="31.2">
</div>

<br>

<div class="row">
<input id="amount" type="tel" inputmode="numeric" placeholder="輸入金額">
<input id="km" type="tel" inputmode="numeric" placeholder="輸入里程">
</div>

<br>

<button onclick="save()">儲存</button>

</div>

<div class="card">
<div class="small">距離</div>
<div class="stat" id="distance">0 km</div>

<div class="small">平均油耗</div>
<div class="stat" id="avg">- km/L</div>
</div>

<div class="card chart-box">
<canvas id="chart"></canvas>
</div>

</div>

<script>

let records = JSON.parse(localStorage.getItem("fuel")||"[]")
let lastKm = localStorage.getItem("lastKm")||""
document.getElementById("km").value = lastKm

const amountEl = document.getElementById("amount")
const kmEl = document.getElementById("km")
const priceEl = document.getElementById("price")

function save(){

let amount = Number(amountEl.value)
let km = Number(kmEl.value)
let price = Number(priceEl.value)

if(!amount || !km) return

let last = records.length ? records[records.length-1].km : null

let dist = last ? (km - last) : 0
let liter = amount / price
let kmpl = (dist>0 && liter>0)? dist/liter : 0

let today = new Date().toISOString().slice(0,10)

// ⭐ 同一天累計
let existing = records.find(r=>r.date===today)

if(existing){
existing.amount += amount
existing.km = km
existing.kmpl = kmpl
}else{
records.push({date:today,km,amount,price,kmpl})
}

localStorage.setItem("fuel",JSON.stringify(records))
localStorage.setItem("lastKm",km)

render()
}

function getWeek(){

let days=[]
let now=new Date()
let start=new Date(now)
start.setDate(now.getDate()-now.getDay())

for(let i=0;i<7;i++){
let d=new Date(start)
d.setDate(start.getDate()+i)

let label="日一二三四五六"[d.getDay()]
+" ("+(d.getMonth()+1)+"/"+d.getDate()+")"

let key=d.toISOString().slice(0,10)

days.push({label,key})
}

return days
}
