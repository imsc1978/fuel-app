<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system;
}

.container{
  padding:16px;
  max-width:520px;
  margin:auto;
}

.card{
  background:#1c1c1e;
  border-radius:16px;
  padding:16px;
  margin-top:16px;
}

.row{
  display:flex;
  gap:12px;
  margin-bottom:12px;
}

.field{
  flex:1;
}

.label{
  font-size:13px;
  color:#aaa;
  margin-bottom:4px;
}

input,select{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2c2c2e;
  color:#fff;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#2aa7ff,#3b6cff);
  color:#fff;
}

.tab{
  display:flex;
  gap:10px;
}

.tab button{
  flex:1;
  background:#2c2c2e;
}

.active{
  background:#3b6cff!important;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h2>⛽ 加油紀錄</h2>

<div class="tab">
  <button id="tabRecord" class="active">紀錄</button>
  <button id="tabHistory">歷史</button>
</div>

<div id="recordPage">

<div class="card">

<div class="row">
  <div class="field">
    <div class="label">油品來源</div>
    <select id="source">
      <option>中油</option>
      <option>台塑</option>
    </select>
  </div>

  <div class="field">
    <div class="label">油種</div>
    <select id="fuel">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
    </select>
  </div>

  <div class="field">
    <div class="label">油價</div>
    <input id="priceInput" type="number">
  </div>
</div>

<div class="row">
  <div class="field">
    <div class="label">金額</div>
    <input id="amountInput" type="number">
  </div>

  <div class="field">
    <div class="label">總里程</div>
    <input id="kmInput" type="number">
  </div>
</div>

<button onclick="save()">儲存</button>

</div>

<div class="card">
距離：<span id="distance">-</span> km<br>
油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<div id="historyPage" class="hidden">
  <div class="card" id="historyList"></div>
</div>

</div>

<script>

let records = JSON.parse(localStorage.getItem("fuel")||"[]")
let chart

const priceMap={
  "92":29.2,
  "95":31.2,
  "98":33.2
}

fuel.onchange=()=>{
  priceInput.value = priceMap[fuel.value]
}
priceInput.value = 31.2

function save(){

  const price = parseFloat(priceInput.value)
  const amount = parseFloat(amountInput.value)
  const km = parseFloat(kmInput.value)

  if(!price || !amount || !km){
    alert("請填完整")
    return
  }

  if(records.length && km < records.at(-1).km){
    alert("里程不能倒退")
    return
  }

  const liter = amount / price

  let kmpl = 0
  if(records.length){
    kmpl = (km - records.at(-1).km) / liter
  }

  records.push({
    date: new Date().toISOString().slice(0,10), // 🔥唯一格式
    km,
    kmpl
  })

  localStorage.setItem("fuel",JSON.stringify(records))

  update()
  drawChart()
  renderHistory()

  amountInput.value=""
}

function update(){
  if(records.length<2){
    distance.innerText="-"
    kmpl.innerText="-"
    return
  }

  const last = records.at(-1)
  const prev = records.at(-2)

  distance.innerText = last.km - prev.km
  kmpl.innerText = last.kmpl.toFixed(2)
}

// 🔥 真正同一天堆疊
function drawChart(){

  if(chart) chart.destroy()
  if(!records.length) return

  const grouped = {}

  records.forEach(r=>{
    if(!grouped[r.date]) grouped[r.date]=[]
    grouped[r.date].push(r)
  })

  const dates = Object.keys(grouped)

  const max = Math.max(...dates.map(d=>grouped[d].length))

  const datasets = []

  for(let i=0;i<max;i++){
    datasets.push({
      label:`第${i+1}次`,
      data: dates.map(d=>grouped[d][i]?.kmpl || 0),
      backgroundColor:`hsl(${i*60},70%,60%)`
    })
  }

  chart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels:dates,datasets},
    options:{
      scales:{
        x:{stacked:true},
        y:{stacked:true}
      }
    }
  })
}

function renderHistory(){
  historyList.innerHTML = records.map(r=>`
    <div>${r.date} | ${r.km} km</div>
  `).join("<hr>")
}

tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
  tabRecord.classList.add("active")
  tabHistory.classList.remove("active")
}

tabHistory.onclick=()=>{
  historyPage.classList.remove("hidden")
  recordPage.classList.add("hidden")
  tabHistory.classList.add("active")
  tabRecord.classList.remove("active")
}

update()
drawChart()
renderHistory()

</script>

</body>
</html>
