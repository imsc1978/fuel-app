<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system;
}

.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}

.title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:12px;
}

.card{
  background:#1c1c1e;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}

/* GRID */
.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

/* INPUT */
input,select{
  width:100%;
  min-width:0; /* 🔥關鍵 防止爆版 */
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:14px;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#1ea9ff,#2f6bff);
  color:#fff;
  margin-top:10px;
  font-size:16px;
}

.sub-btn{
  background:#3a3a3c;
}

/* RESULT */
.result{
  font-size:16px;
  line-height:1.6;
}

/* CHART */
.chart-wrap{
  height:220px;
}

canvas{
  width:100%!important;
  height:100%!important;
}

</style>
</head>

<body>

<div class="container">

<div class="title">⛽ 加油紀錄</div>

<div class="card">

  <div class="grid3">
    <select id="source">
      <option>中油</option>
      <option>台塑</option>
    </select>

    <select id="type">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
      <option value="diesel">柴油</option>
    </select>

    <input id="price">
  </div>

  <div class="grid2">
    <input id="amount" placeholder="金額" inputmode="decimal">
    <input id="km" placeholder="總里程" inputmode="numeric">
  </div>

  <button onclick="save()">儲存</button>
  <button class="sub-btn" onclick="editLast()">✏️ 修改最後一筆</button>
  <button class="sub-btn" onclick="deleteLast()">🗑 刪除最後一筆</button>

</div>

<div class="card result">
  距離：<span id="distance">-</span> km<br>
  油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card chart-wrap">
  <canvas id="chart"></canvas>
</div>

</div>

<script>

let priceMap={
  "中油":{"92":30.2,"95":31.2,"98":33.2,"diesel":28},
  "台塑":{"92":30,"95":31,"98":33,"diesel":27.8}
}

const sourceEl=document.getElementById("source")
const typeEl=document.getElementById("type")
const priceEl=document.getElementById("price")
const amountEl=document.getElementById("amount")
const kmEl=document.getElementById("km")

let records=JSON.parse(localStorage.getItem("fuel")||"[]")
let chart=null

function updatePrice(){
  priceEl.value=priceMap[sourceEl.value][typeEl.value]
}
sourceEl.onchange=updatePrice
typeEl.onchange=updatePrice
updatePrice()

function today(){
  let d=new Date()
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`
}

function save(){

  let amount=parseFloat(amountEl.value)
  let km=parseFloat(kmEl.value)
  let price=parseFloat(priceEl.value)

  if(!amount || !km){
    alert("請輸入完整資料")
    return
  }

  let last=records.at(-1)

  if(last && km<=last.km){
    alert("里程需大於上一筆")
    return
  }

  let dist=last?km-last.km:null
  let kmpl=dist?dist/(amount/price):null

  records.push({
    date:today(),
    km,
    kmpl
  })

  localStorage.setItem("fuel",JSON.stringify(records))

  amountEl.value=""

  render()
}

function editLast(){
  if(!records.length) return

  let last=records.at(-1)

  kmEl.value=last.km

  alert("修改後按儲存（會新增一筆）")
}

function deleteLast(){
  if(!records.length) return

  if(confirm("刪除最後一筆？")){
    records.pop()
    localStorage.setItem("fuel",JSON.stringify(records))
    render()
  }
}

function render(){

  if(records.length>=2){
    let last=records.at(-1)
    let prev=records.at(-2)

    distance.innerText=last.km-prev.km
    kmpl.innerText=last.kmpl.toFixed(2)
  }

  if(records.length){
    kmEl.value=records.at(-1).km
  }

  drawChart()
}

function getWeek(){
  let arr=[]
  for(let i=6;i>=0;i--){
    let d=new Date()
    d.setDate(d.getDate()-i)
    let key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`
    let label=(d.getMonth()+1)+"/"+d.getDate()
    arr.push({key,label})
  }
  return arr
}

function drawChart(){

  let week=getWeek()
  let map={}

  records.forEach(r=>{
    if(!r.kmpl) return
    if(!map[r.date]) map[r.date]=[]
    map[r.date].push(r.kmpl)
  })

  let labels=[]
  let data=[]

  week.forEach(d=>{
    labels.push(d.label)
    if(map[d.key]){
      let avg=map[d.key].reduce((a,b)=>a+b,0)/map[d.key].length
      data.push(avg)
    }else{
      data.push(0)
    }
  })

  if(chart) chart.destroy()

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels,datasets:[{data}]},
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  })
}

render()

</script>

</body>
</html>
