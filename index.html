<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  background:#000;
  color:#fff;
  font-family:sans-serif;
  padding:16px;
}

h2{
  margin-bottom:16px;
}

.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:18px;
  margin-bottom:16px;
}

.row{
  display:grid;
  gap:10px;
}

.row-3{
  grid-template-columns:1fr 1fr 1fr;
}

.row-2{
  grid-template-columns:1fr 1fr;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#1ea9ff,#2f6bff);
  color:#fff;
  font-size:16px;
}

canvas{
  width:100%;
  height:200px;
}
</style>
</head>

<body>

<h2>⛽ 加油紀錄</h2>

<div class="card">

  <div class="row row-3">
    <select id="source">
      <option>中油</option>
      <option>台塑</option>
    </select>

    <select id="type">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
      <option value="diesel">柴油</option>
    </select>

    <input id="price" type="number" step="0.1">
  </div>

  <div class="row row-2" style="margin-top:10px;">
    <input id="amount" placeholder="金額" type="number" inputmode="decimal">
    <input id="km" placeholder="總里程" type="number" inputmode="numeric">
  </div>

  <button style="margin-top:12px;" onclick="save()">儲存</button>
</div>

<div class="card">
  距離：<span id="distance">-</span> km<br>
  油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<script>

let priceMap={
  "中油":{"92":30.2,"95":31.2,"98":33.2,"diesel":28},
  "台塑":{"92":30.0,"95":31.0,"98":33.0,"diesel":27.8}
}

let records=JSON.parse(localStorage.getItem("fuel")||"[]")

let amountInput=document.getElementById("amount")
let kmInput=document.getElementById("km")
let source=document.getElementById("source")
let type=document.getElementById("type")
let price=document.getElementById("price")
let distance=document.getElementById("distance")
let kmpl=document.getElementById("kmpl")
let chartEl=document.getElementById("chart")

let chartInstance=null

// 油價更新
function updatePrice(){
  price.value = priceMap[source.value][type.value]
}

source.onchange=updatePrice
type.onchange=updatePrice
updatePrice()

// 儲存
function save(){

  let amount=parseFloat(amountInput.value)
  let km=parseFloat(kmInput.value)
  let priceVal=parseFloat(price.value)

  if(!amount || !km){
    alert("請輸入完整資料")
    return
  }

  let last=records.length ? records[records.length-1] : null

  // 防呆：里程不能倒退
  if(last && km <= last.km){
    alert(`里程錯誤\n目前輸入：${km}\n上一筆：${last.km}`)
    return
  }

  let today=new Date().toISOString().slice(0,10)

  let dist=null
  let kmplVal=null

  if(last){
    dist=km-last.km
    let liter=amount/priceVal
    kmplVal=dist/liter
  }

  records.push({
    date:today,
    km:km,
    kmpl:kmplVal
  })

  localStorage.setItem("fuel",JSON.stringify(records))

  render()
}

// 畫面更新
function render(){

  if(records.length < 2){
    distance.innerText="-"
    kmpl.innerText="-"
  }else{
    let last=records[records.length-1]
    let prev=records[records.length-2]

    let dist=last.km-prev.km
    distance.innerText=dist

    kmpl.innerText=last.kmpl.toFixed(2)
  }

  // 自動帶入上一筆里程
  if(records.length){
    kmInput.value=records[records.length-1].km
  }

  drawChart()
}

// 圖表
function drawChart(){

  let labels=[]
  let data=[]

  records.forEach(r=>{
    labels.push(r.date.slice(5))
    data.push(r.kmpl || null)
  })

  if(chartInstance){
    chartInstance.destroy()
  }

  chartInstance=new Chart(chartEl,{
    type:"bar",
    data:{
      labels:labels,
      datasets:[{
        label:"km/L",
        data:data
      }]
    },
    options:{
      plugins:{
        legend:{display:false}
      },
      scales:{
        y:{
          beginAtZero:true
        }
      }
    }
  })
}

render()

</script>

</body>
</html>
