<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>油耗管理</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:sans-serif;
  padding:16px;
}

.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:18px;
  margin-bottom:16px;
}

.row{
  display:grid;
  gap:10px;
}

.row-3{
  grid-template-columns:repeat(3,1fr);
}

.row-2{
  grid-template-columns:repeat(2,1fr);
}

input,select{
  width:100%;
  min-width:0; /* 🔥 防爆關鍵 */
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#1ea9ff,#2f6bff);
  color:#fff;
  font-size:16px;
}

canvas{
  width:100%;
  height:220px;
}
</style>
</head>

<body>

<h2>⛽ 加油紀錄</h2>

<div class="card">

  <!-- 上排 -->
  <div class="row row-3">
    <select id="source">
      <option>中油</option>
      <option>台塑</option>
    </select>

    <select id="type">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
      <option value="diesel">柴油</option>
    </select>

    <input id="price" type="number" step="0.1">
  </div>

  <!-- 下排（你剛剛消失的里程在這） -->
  <div class="row row-2" style="margin-top:10px;">
    <input id="amount" placeholder="金額" type="number" inputmode="decimal">
    <input id="km" placeholder="總里程" type="number" inputmode="numeric">
  </div>

  <button style="margin-top:12px;" onclick="save()">儲存</button>
</div>

<div class="card">
  距離：<span id="distance">-</span> km<br>
  油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<script>

let priceMap={
  "中油":{"92":30.2,"95":31.2,"98":33.2,"diesel":28},
  "台塑":{"92":30,"95":31,"98":33,"diesel":27.8}
}

let records=JSON.parse(localStorage.getItem("fuel")||"[]")

let chartInstance=null

function updatePrice(){
  price.value=priceMap[source.value][type.value]
}

source.onchange=updatePrice
type.onchange=updatePrice
updatePrice()

function save(){

  let amount=parseFloat(amount.value)
  let kmVal=parseFloat(km.value)
  let priceVal=parseFloat(price.value)

  if(!amount || !kmVal){
    alert("請輸入完整")
    return
  }

  let last=records.length?records[records.length-1]:null

  if(last && kmVal <= last.km){
    alert("里程不能小於上一筆")
    return
  }

  let today=new Date().toISOString().slice(0,10)

  let dist=null
  let kmplVal=null

  if(last){
    dist=kmVal-last.km
    kmplVal=dist/(amount/priceVal)
  }

  records.push({
    date:today,
    km:kmVal,
    kmpl:kmplVal
  })

  localStorage.setItem("fuel",JSON.stringify(records))

  render()
}

function render(){

  if(records.length<2){
    distance.innerText="-"
    kmpl.innerText="-"
  }else{
    let last=records.at(-1)
    let prev=records.at(-2)

    let dist=last.km-prev.km
    distance.innerText=dist
    kmpl.innerText=last.kmpl.toFixed(2)
  }

  if(records.length){
    km.value=records.at(-1).km
  }

  drawChart()
}

function getLast7Days(){

  let arr=[]

  for(let i=6;i>=0;i--){
    let d=new Date()
    d.setDate(d.getDate()-i)

    let key=d.toISOString().slice(0,10)
    let label=(d.getMonth()+1)+"/"+d.getDate()

    arr.push({key,label})
  }

  return arr
}

function drawChart(){

  let week=getLast7Days()

  let labels=[]
  let data=[]

  week.forEach(day=>{
    labels.push(day.label)

    let found=records.find(r=>r.date===day.key)

    data.push(found && found.kmpl ? found.kmpl : 0)
  })

  if(chartInstance){
    chartInstance.destroy()
  }

  chartInstance=new Chart(chart,{
    type:"bar",
    data:{
      labels:labels,
      datasets:[{
        data:data
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true}
      }
    }
  })
}

render()

</script>

</body>
</html>
