<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;}
body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding:16px;}
.card{background:#1c1c1e;padding:16px;border-radius:18px;margin-bottom:16px;}
.row{display:grid;gap:10px;}
.row-3{grid-template-columns:repeat(3,1fr);}
.row-2{grid-template-columns:repeat(2,1fr);}
input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#1ea9ff,#2f6bff);
  color:#fff;
}
canvas{height:220px;}
</style>
</head>

<body>

<h2>⛽ 加油紀錄</h2>

<div class="card">

  <div class="row row-3">
    <select id="source">
      <option>中油</option>
      <option>台塑</option>
    </select>

    <select id="type">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
      <option value="diesel">柴油</option>
    </select>

    <input id="price">
  </div>

  <div class="row row-2" style="margin-top:10px;">
    <input id="amount" placeholder="金額" inputmode="decimal">
    <input id="km" placeholder="總里程" inputmode="numeric">
  </div>

  <button onclick="save()">儲存</button>
</div>

<div class="card">
  距離：<span id="distance">-</span> km<br>
  油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<script>

const sourceEl = document.getElementById("source")
const typeEl = document.getElementById("type")
const priceEl = document.getElementById("price")
const amountEl = document.getElementById("amount")
const kmEl = document.getElementById("km")

let priceMap={
  "中油":{"92":30.2,"95":31.2,"98":33.2,"diesel":28},
  "台塑":{"92":30,"95":31,"98":33,"diesel":27.8}
}

let records=JSON.parse(localStorage.getItem("fuel")||"[]")
let chartInstance=null

function updatePrice(){
  priceEl.value = priceMap[sourceEl.value][typeEl.value]
}
sourceEl.onchange=updatePrice
typeEl.onchange=updatePrice
updatePrice()

function today(){
  let d=new Date()
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`
}

function save(){

  let amount=parseFloat(amountEl.value)
  let kmVal=parseFloat(kmEl.value)
  let price=parseFloat(priceEl.value)

  if(!amount || !kmVal){
    alert("請輸入完整")
    return
  }

  let last=records.at(-1)

  if(last && kmVal <= last.km){
    alert("里程不能小於上一筆")
    return
  }

  let dist = last ? kmVal-last.km : null
  let kmpl = dist ? dist/(amount/price) : null

  records.push({
    date:today(),
    km:kmVal,
    kmpl:kmpl
  })

  localStorage.setItem("fuel",JSON.stringify(records))

  amountEl.value=""

  render()
}

function render(){

  if(records.length>=2){
    let last=records.at(-1)
    let prev=records.at(-2)

    distance.innerText = last.km-prev.km
    kmpl.innerText = last.kmpl.toFixed(2)
  }

  if(records.length){
    kmEl.value = records.at(-1).km
  }

  drawChart()
}

function getWeek(){

  let arr=[]

  for(let i=6;i>=0;i--){
    let d=new Date()
    d.setDate(d.getDate()-i)

    let key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`
    let label=(d.getMonth()+1)+"/"+d.getDate()

    arr.push({key,label})
  }

  return arr
}

function drawChart(){

  let week=getWeek()

  // 🔥 先整理資料（同一天合併）
  let map={}

  records.forEach(r=>{
    if(!r.kmpl) return
    if(!map[r.date]){
      map[r.date]=[]
    }
    map[r.date].push(r.kmpl)
  })

  let labels=[]
  let data=[]

  week.forEach(d=>{
    labels.push(d.label)

    if(map[d.key]){
      let avg = map[d.key].reduce((a,b)=>a+b,0)/map[d.key].length
      data.push(avg)
    }else{
      data.push(0)
    }
  })

  if(chartInstance){
    chartInstance.destroy()
  }

  chartInstance=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels:labels,
      datasets:[{
        data:data,
        backgroundColor:"#3b82f6"
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true}
      }
    }
  })
}

render()

</script>

</body>
</html>
