<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;}
.container{padding:16px;max-width:500px;margin:auto;}
.tabs{display:flex;gap:10px;margin-bottom:16px;}
.tab{flex:1;padding:12px;border-radius:12px;text-align:center;background:#2c2c2e;}
.active{background:#4facfe;}
.card{background:#1c1c1e;padding:16px;border-radius:16px;margin-bottom:16px;}
.row{display:flex;gap:10px;margin-bottom:10px;}
.col{flex:1;}
label{font-size:12px;color:#aaa;margin-bottom:4px;display:block;}
input,select{
  width:100%;padding:12px;border-radius:10px;border:none;
  background:#2c2c2e;color:#fff;font-size:16px;box-sizing:border-box;
}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#4facfe;color:#fff;}
.hidden{display:none;}
.item{padding:12px;border-bottom:1px solid #333;}
.item:hover{background:#2c2c2e;}
</style>
</head>

<body>
<div class="container">

<h2>⛽ 加油紀錄</h2>

<div class="tabs">
<div id="tabRecord" class="tab active">紀錄</div>
<div id="tabHistory" class="tab">歷史</div>
</div>

<!-- 記錄頁 -->
<div id="recordPage">

<div class="card">

<div class="row">
<div class="col">
<label>油種</label>
<select id="type">
<option>92</option>
<option selected>95</option>
<option>98</option>
<option>柴油</option>
</select>
</div>

<div class="col">
<label>油價</label>
<input id="price">
</div>
</div>

<div class="row">
<div class="col">
<label>金額</label>
<input id="amount">
</div>

<div class="col">
<label>總里程</label>
<input id="km">
</div>
</div>

<button onclick="save()">儲存</button>

</div>

<div class="card" id="result">-</div>
<div class="card"><canvas id="chart"></canvas></div>

</div>

<!-- 歷史 -->
<div id="historyPage" class="hidden">
<div class="card" id="historyList"></div>
</div>

</div>

<script>

/* ===== 資料層 ===== */
function loadData(){
  let d = JSON.parse(localStorage.getItem("fuel")||"[]")
  return d.filter(i => i && !isNaN(i.km))
}
function saveData(){
  localStorage.setItem("fuel",JSON.stringify(data))
}

let data = loadData()

/* ===== 油價 ===== */
const priceMap={92:30,95:31.2,98:33,柴油:28}
type.onchange=()=>price.value=priceMap[type.value]
price.value=priceMap[type.value]

/* ===== tab ===== */
tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
}
tabHistory.onclick=()=>{
  recordPage.classList.add("hidden")
  historyPage.classList.remove("hidden")
  renderHistory()
}

/* ===== 自動帶入里程 ===== */
function preloadKm(){
  if(data.length){
    km.value = data[data.length-1].km
  }
}

/* ===== 核心重算 ===== */
function recalc(){

  for(let i=0;i<data.length;i++){

    if(i===0){
      data[i].distance=0
      data[i].avg=0
      continue
    }

    const prev=data[i-1]
    const curr=data[i]

    const distance = curr.km - prev.km
    const liter = curr.amount / curr.price

    curr.distance = distance>0?distance:0
    curr.avg = liter>0?distance/liter:0
  }
}

/* ===== 儲存 ===== */
function save(){

  const amountVal=parseFloat(amount.value)
  const kmVal=parseFloat(km.value)
  const priceVal=parseFloat(price.value)

  if(!amountVal || !kmVal){
    alert("請輸入完整")
    return
  }

  if(data.length && kmVal <= data[data.length-1].km){
    alert("里程需大於上一筆")
    return
  }

  data.push({
    date:new Date().toISOString().slice(0,10),
    km:kmVal,
    amount:amountVal,
    price:priceVal
  })

  recalc()
  saveData()

  preloadKm()
  update()
}

/* ===== 更新 ===== */
function update(){

  if(data.length<2){
    result.innerHTML="距離：-- km<br>油耗：-- km/L"
    return
  }

  const last=data[data.length-1]

  result.innerHTML=
  `距離：${last.distance.toFixed(0)} km<br>
   油耗：${last.avg.toFixed(2)} km/L`

  drawChart()
}

/* ===== 歷史（最新→舊 + 編輯刪除） ===== */
function renderHistory(){

  const reversed=[...data].reverse()

  historyList.innerHTML=reversed.map((item,i)=>{

    const realIndex=data.length-1-i

    return `
      <div class="item" onclick="editItem(${realIndex})">
        ${item.date} | ${item.km} km
      </div>
    `
  }).join("")
}

function editItem(index){

  const item=data[index]

  const action=prompt("1 修改\n2 刪除","1")

  if(action==="2"){
    if(confirm("確定刪除？")){
      data.splice(index,1)
    }
  }

  if(action==="1"){

    const newKm=prompt("修改里程",item.km)
    if(newKm===null) return

    const newAmount=prompt("修改金額",item.amount)
    if(newAmount===null) return

    item.km=parseFloat(newKm)
    item.amount=parseFloat(newAmount)
  }

  recalc()
  saveData()
  renderHistory()
  update()
}

/* ===== 圖表 ===== */
let chart

function drawChart(){

  if(chart) chart.destroy()

  const grouped={}

  data.forEach(i=>{
    if(!grouped[i.date]) grouped[i.date]=[]
    grouped[i.date].push(i.avg)
  })

  const labels=Object.keys(grouped)
  const max=Math.max(...Object.values(grouped).map(a=>a.length))

  const datasets=[]

  for(let i=0;i<max;i++){
    datasets.push({
      data:labels.map(d=>grouped[d][i]||0),
      backgroundColor:`hsl(${i*70},70%,60%)`,
      stack:"a"
    })
  }

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels,datasets},
    options:{
      plugins:{legend:false},
      scales:{x:{stacked:true},y:{stacked:true}}
    }
  })
}

/* ===== init ===== */
preloadKm()
update()

</script>

</body>
</html>
