<script>
const price = 31.2;

/* ========= 安全讀資料 ========= */
let raw = [];
try {
    raw = JSON.parse(localStorage.getItem("records") || "[]");
} catch (e) {
    raw = [];
}

/* ========= 自動修復舊資料 ========= */
let records = raw
    .map(r => {
        if (typeof r === "number") {
            return null; // 舊格式直接丟掉
        }
        if (!r || !r.date) return null;
        return {
            date: r.date,
            value: Number(r.value)
        };
    })
    .filter(r => r && !isNaN(r.value));

/* ========= 里程 ========= */
let lastMileage = localStorage.getItem("lastMileage");
if (lastMileage !== null) {
    lastMileage = parseFloat(lastMileage);
    document.getElementById("mileage").value = lastMileage;
}

/* ========= 日期工具 ========= */
function getToday() {
    return new Date().toISOString().split("T")[0];
}

function getWeekLabel(dateStr) {
    const d = new Date(dateStr);
    const days = ["日","一","二","三","四","五","六"];
    return days[d.getDay()] + "（" + (d.getMonth()+1) + "/" + d.getDate() + "）";
}

function getLast7Days() {
    let arr = [];

    for (let i = 6; i >= 0; i--) {
        let d = new Date();
        d.setDate(d.getDate() - i);

        let str = d.toISOString().split("T")[0];

        let found = records.find(r => r.date === str);

        arr.push({
            date: str,
            value: found ? Number(found.value) : null
        });
    }

    return arr;
}

/* ========= 建立圖表 ========= */
const ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: [],
        datasets: [{
            label: 'km/L',
            data: [],
        }]
    },
    options: {
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});

/* ========= 更新圖 ========= */
function updateChart() {
    const weekData = getLast7Days();

    chart.data.labels = weekData.map(d => getWeekLabel(d.date));
    chart.data.datasets[0].data = weekData.map(d => d.value);

    chart.update();
}

/* ========= 儲存 ========= */
function saveData() {
    const amount = parseFloat(document.getElementById("amount").value);
    const mileage = parseFloat(document.getElementById("mileage").value);

    if (!amount || !mileage) return;

    if (lastMileage !== null) {
        const distance = mileage - lastMileage;
        const fuel = amount / price;
        const efficiency = distance / fuel;

        document.getElementById("distance").innerText = distance + " km";
        document.getElementById("efficiency").innerText = efficiency.toFixed(2) + " km/L";

        const today = getToday();

        const index = records.findIndex(r => r.date === today);

        if (index >= 0) {
            records[index].value = efficiency;
        } else {
            records.push({
                date: today,
                value: efficiency
            });
        }

        localStorage.setItem("records", JSON.stringify(records));

        updateChart();
    }

    localStorage.setItem("lastMileage", mileage);
    lastMileage = mileage;

    document.getElementById("amount").value = "";
}

/* ========= 啟動 ========= */
updateChart();
</script>
