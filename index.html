<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system;
}

.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}

.title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:12px;
}

/* Tabs */
.tabs{
  display:flex;
  margin-bottom:12px;
}
.tab{
  flex:1;
  padding:10px;
  text-align:center;
  background:#1c1c1e;
  border-radius:10px;
  margin-right:6px;
}
.tab.active{
  background:#2f6bff;
}

/* Card */
.card{
  background:#1c1c1e;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}

/* Grid */
.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

/* Input group */
.group{
  display:flex;
  flex-direction:column;
  gap:4px;
}

label{
  font-size:13px;
  color:#aaa;
}

/* Input */
input,select{
  width:100%;
  min-width:0;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
}

/* Button */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#1ea9ff,#2f6bff);
  color:#fff;
  margin-top:10px;
}

.sub-btn{
  background:#3a3a3c;
}

/* Result */
.result{
  font-size:16px;
  line-height:1.6;
}

/* History */
.item{
  padding:12px;
  border-bottom:1px solid #333;
}

/* Chart */
.chart-wrap{
  height:220px;
}
canvas{
  width:100%!important;
  height:100%!important;
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="container">

<div class="title">⛽ 加油紀錄</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('main')">紀錄</div>
  <div class="tab" onclick="switchTab('history')">📋 歷史</div>
</div>

<!-- 主頁 -->
<div id="main">

<div class="card">

  <div class="grid3">
    <select id="source">
      <option>中油</option>
      <option>台塑</option>
    </select>

    <select id="type">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
      <option value="diesel">柴油</option>
    </select>

    <input id="price">
  </div>

  <div class="grid2">

    <div class="group">
      <label>金額</label>
      <input id="amount" inputmode="decimal">
    </div>

    <div class="group">
      <label>總里程</label>
      <input id="km" inputmode="numeric">
    </div>

  </div>

  <button onclick="save()">儲存</button>
  <button class="sub-btn" onclick="deleteLast()">刪除最後一筆</button>

</div>

<div class="card result">
  距離：<span id="distance">-</span> km<br>
  油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card chart-wrap">
  <canvas id="chart"></canvas>
</div>

</div>

<!-- 歷史 -->
<div id="history" class="hidden">
  <div class="card" id="historyList"></div>
</div>

</div>

<script>

let priceMap={
  "中油":{"92":30.2,"95":31.2,"98":33.2,"diesel":28},
  "台塑":{"92":30,"95":31,"98":33,"diesel":27.8}
}

let records=JSON.parse(localStorage.getItem("fuel")||"[]")
let chart=null

const sourceEl=document.getElementById("source")
const typeEl=document.getElementById("type")
const priceEl=document.getElementById("price")

function updatePrice(){
  priceEl.value=priceMap[sourceEl.value][typeEl.value]
}
sourceEl.onchange=updatePrice
typeEl.onchange=updatePrice
updatePrice()

function today(){
  let d=new Date()
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`
}

function save(){

  let amount=parseFloat(amount.value)
  let km=parseFloat(document.getElementById("km").value)
  let price=parseFloat(priceEl.value)

  if(!amount || !km){
    alert("請輸入資料")
    return
  }

  let last=records.at(-1)

  if(last && km<=last.km){
    alert("里程需大於上一筆")
    return
  }

  let dist=last?km-last.km:null
  let kmpl=dist?dist/(amount/price):null

  records.push({
    date:today(),
    km,
    kmpl
  })

  localStorage.setItem("fuel",JSON.stringify(records))

  amount.value=""
  render()
}

function deleteLast(){
  if(!records.length) return
  records.pop()
  localStorage.setItem("fuel",JSON.stringify(records))
  render()
}

function render(){

  if(records.length>=2){
    let last=records.at(-1)
    let prev=records.at(-2)

    distance.innerText=last.km-prev.km
    kmpl.innerText=last.kmpl.toFixed(2)
  }

  renderHistory()
  drawChart()
}

function renderHistory(){

  let html=""

  records.slice().reverse().forEach((r,i)=>{
    html+=`
      <div class="item" onclick="loadRecord(${records.length-1-i})">
        📅 ${r.date}<br>
        里程：${r.km} km
      </div>
    `
  })

  document.getElementById("historyList").innerHTML=html
}

function loadRecord(i){
  let r=records[i]
  document.getElementById("km").value=r.km
  switchTab('main')
}

function switchTab(tab){

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))

  if(tab==="main"){
    main.classList.remove("hidden")
    history.classList.add("hidden")
    document.querySelectorAll(".tab")[0].classList.add("active")
  }else{
    history.classList.remove("hidden")
    main.classList.add("hidden")
    document.querySelectorAll(".tab")[1].classList.add("active")
  }
}

function getWeek(){
  let arr=[]
  for(let i=6;i>=0;i--){
    let d=new Date()
    d.setDate(d.getDate()-i)
    let key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`
    let label=(d.getMonth()+1)+"/"+d.getDate()
    arr.push({key,label})
  }
  return arr
}

function drawChart(){

  let week=getWeek()
  let map={}

  records.forEach(r=>{
    if(!r.kmpl) return
    if(!map[r.date]) map[r.date]=[]
    map[r.date].push(r.kmpl)
  })

  let labels=[]
  let data=[]

  week.forEach(d=>{
    labels.push(d.label)
    if(map[d.key]){
      let avg=map[d.key].reduce((a,b)=>a+b,0)/map[d.key].length
      data.push(avg)
    }else{
      data.push(0)
    }
  })

  if(chart) chart.destroy()

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels,datasets:[{data}]},
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  })
}

render()

</script>

</body>
</html>
