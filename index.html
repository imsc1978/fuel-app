<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system;
}

.container{
  padding:16px;
  max-width:500px;
  margin:auto;
}

.card{
  background:#1c1c1e;
  border-radius:16px;
  padding:16px;
  margin-top:16px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

input,select{
  flex:1;
  min-width:0;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2c2c2e;
  color:#fff;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#2aa7ff,#3b6cff);
  color:#fff;
}

.tab{
  display:flex;
  gap:10px;
}

.tab button{
  flex:1;
  background:#2c2c2e;
}

.active{
  background:#3b6cff!important;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h2>⛽ 加油紀錄</h2>

<div class="tab">
  <button id="tabRecord" class="active">紀錄</button>
  <button id="tabHistory">歷史</button>
</div>

<div id="recordPage">

<div class="card">

<div class="row">
  <select id="fuel">
    <option value="92">92</option>
    <option value="95" selected>95</option>
    <option value="98">98</option>
  </select>

  <input id="priceInput" type="number">
</div>

<div class="row">
  <input id="amountInput" placeholder="金額" type="number">
  <input id="kmInput" placeholder="總里程" type="number">
</div>

<button onclick="save()">儲存</button>

</div>

<div class="card">
距離：<span id="distance">-</span> km<br>
油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<div id="historyPage" class="hidden">
  <div class="card" id="historyList"></div>
</div>

</div>

<script>

let records = JSON.parse(localStorage.getItem("fuel")||"[]")
let chart

const priceMap={
  "92":29.2,
  "95":31.2,
  "98":33.2
}

const fuel = document.getElementById("fuel")
const priceInput = document.getElementById("priceInput")
const amountInput = document.getElementById("amountInput")
const kmInput = document.getElementById("kmInput")

fuel.onchange = ()=>{
  priceInput.value = priceMap[fuel.value]
}

priceInput.value = 31.2

function save(){

  const price = parseFloat(priceInput.value)
  const amount = parseFloat(amountInput.value)
  const km = parseFloat(kmInput.value)

  if(!price || !amount || !km){
    alert("請填完整")
    return
  }

  if(records.length){
    if(km < records[records.length-1].km){
      alert("里程錯誤")
      return
    }
  }

  const liter = amount / price

  let kmpl = 0

  if(records.length){
    const last = records[records.length-1].km
    kmpl = (km - last) / liter
  }

  records.push({
    date:new Date().toISOString().slice(0,10),
    km,
    kmpl
  })

  localStorage.setItem("fuel",JSON.stringify(records))

  update()
  drawChart()
  renderHistory()

  amountInput.value=""
}

function update(){
  if(records.length<2){
    distance.innerText="-"
    kmpl.innerText="-"
    return
  }

  const last = records[records.length-1]
  const prev = records[records.length-2]

  distance.innerText = last.km - prev.km
  kmpl.innerText = last.kmpl.toFixed(2)
}

function drawChart(){

  if(chart) chart.destroy()

  if(!records.length) return

  const grouped={}

  records.forEach(r=>{
    if(!grouped[r.date]) grouped[r.date]=[]
    grouped[r.date].push(r)
  })

  const dates = Object.keys(grouped)

  const max = Math.max(...dates.map(d=>grouped[d].length))

  const datasets=[]

  for(let i=0;i<max;i++){
    datasets.push({
      data: dates.map(d=>grouped[d][i]?.kmpl || 0),
      backgroundColor:`hsl(${i*70},70%,60%)`
    })
  }

  const ctx = document.getElementById("chart")

  chart = new Chart(ctx,{
    type:"bar",
    data:{
      labels:dates,
      datasets
    },
    options:{
      scales:{
        x:{stacked:true},
        y:{stacked:true}
      }
    }
  })
}

function renderHistory(){
  historyList.innerHTML = records.map(r=>`
    <div>${r.date} | ${r.km} km</div>
  `).join("<hr>")
}

tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
  tabRecord.classList.add("active")
  tabHistory.classList.remove("active")
}

tabHistory.onclick=()=>{
  historyPage.classList.remove("hidden")
  recordPage.classList.add("hidden")
  tabHistory.classList.add("active")
  tabRecord.classList.remove("active")
}

update()
drawChart()
renderHistory()

</script>

</body>
</html>
