<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#000;
  color:#fff;
}

.container{
  padding:16px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.tab{
  flex:1;
  padding:14px;
  text-align:center;
  background:#222;
  border-radius:14px;
}

.active{
  background:#3b6cff;
}

.card{
  background:#1a1a1a;
  padding:16px;
  border-radius:20px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

label{
  font-size:12px;
  color:#aaa;
  margin-bottom:6px;
  display:block;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#2a2a2a;
  color:#fff;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  background:linear-gradient(90deg,#29a3ff,#3b6cff);
  color:#fff;
  font-size:18px;
  margin-top:12px;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

<h2>⛽ 加油紀錄</h2>

<div class="tabs">
  <div id="tabRecord" class="tab active">紀錄</div>
  <div id="tabHistory" class="tab">歷史</div>
</div>

<div id="recordPage">

<div class="card">

<div class="grid">
  <div>
    <label>油品來源</label>
    <select id="brand">
      <option>中油</option>
      <option>台塑</option>
    </select>
  </div>

  <div>
    <label>油種</label>
    <select id="type">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
      <option value="diesel">柴油</option>
    </select>
  </div>

  <div>
    <label>油價</label>
    <input id="price" readonly>
  </div>
</div>

<div class="grid2">
  <div>
    <label>金額</label>
    <input id="amount" type="text" inputmode="decimal" placeholder="輸入金額">
  </div>

  <div>
    <label>總里程</label>
    <input id="mileage" type="text" inputmode="numeric" placeholder="輸入里程">
  </div>
</div>

<button id="save">儲存</button>

</div>

<div class="card">
距離：<span id="distance">-</span> km<br>
油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<div id="historyPage" class="hidden">
<div class="card" id="historyList"></div>
</div>

</div>

<script>

const amountEl = document.getElementById("amount")
const mileageEl = document.getElementById("mileage")
const priceEl = document.getElementById("price")
const typeEl = document.getElementById("type")

const distanceEl = document.getElementById("distance")
const kmplEl = document.getElementById("kmpl")

const prices={
  92:29,
  95:31.2,
  98:33.2,
  diesel:27
}

function updatePrice(){
  priceEl.value = prices[typeEl.value]
}
typeEl.onchange=updatePrice
updatePrice()

let data = JSON.parse(localStorage.getItem("fuel")||"[]")

// ✅ 修正 undefined：正確帶入
if(data.length>0){
  mileageEl.value = data[data.length-1].mileage
}

document.getElementById("save").onclick=()=>{

  const amount = parseFloat(amountEl.value)
  const mileage = parseInt(mileageEl.value)
  const price = parseFloat(priceEl.value)

  // ✅ 防 NaN
  if(isNaN(amount) || isNaN(mileage)){
    alert("請輸入正確數字")
    return
  }

  if(data.length && mileage <= data[data.length-1].mileage){
    alert("里程需大於上一筆")
    return
  }

  const liters = amount / price

  data.push({
    date:new Date().toISOString().slice(0,10),
    mileage,
    liters
  })

  localStorage.setItem("fuel",JSON.stringify(data))

  amountEl.value=""
  mileageEl.value=mileage

  update()
}

function update(){

  if(data.length<2){
    distanceEl.innerText="-"
    kmplEl.innerText="-"
    drawChart()
    renderHistory()
    return
  }

  let dist=0
  let fuel=0

  for(let i=1;i<data.length;i++){
    dist += data[i].mileage - data[i-1].mileage
    fuel += data[i].liters
  }

  distanceEl.innerText = dist
  kmplEl.innerText = (dist/fuel).toFixed(2)

  drawChart()
  renderHistory()
}

function getWeek(){
  const now=new Date()
  const day=now.getDay()||7
  const monday=new Date(now)
  monday.setDate(now.getDate()-day+1)

  let arr=[]
  for(let i=0;i<7;i++){
    let d=new Date(monday)
    d.setDate(monday.getDate()+i)
    arr.push(d.toISOString().slice(5,10))
  }
  return arr
}

let chart

function drawChart(){

  const labels=getWeek()

  let datasets=[0,1,2,3,4].map(i=>({
    data:labels.map(()=>0),
    backgroundColor:`hsl(${i*60},70%,60%)`,
    stack:"a"
  }))

  let map={}

  data.forEach(d=>{
    let key=d.date.slice(5,10)
    if(!map[key]) map[key]=[]
    map[key].push(d)
  })

  labels.forEach((day,i)=>{
    let list=map[day]||[]
    list.forEach((item,index)=>{
      datasets[index].data[i]=item.liters
    })
  })

  if(chart) chart.destroy()

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels,datasets},
    options:{
      plugins:{legend:{display:false}},
      scales:{x:{stacked:true},y:{stacked:true}}
    }
  })
}

function renderHistory(){
  const el=document.getElementById("historyList")
  el.innerHTML=""

  data.slice().reverse().forEach(d=>{
    const div=document.createElement("div")
    div.innerText=`${d.date} | ${d.mileage} km`
    div.style.padding="10px 0"
    div.style.borderBottom="1px solid #333"
    el.appendChild(div)
  })
}

tabRecord.onclick=()=>{
  recordPage.classList.remove("hidden")
  historyPage.classList.add("hidden")
}

tabHistory.onclick=()=>{
  historyPage.classList.remove("hidden")
  recordPage.classList.add("hidden")
}

update()

</script>

</body>
</html>
