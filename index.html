<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>油耗管理</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  background:#000;
  color:#fff;
  font-family:sans-serif;
  padding:16px;
}

.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:18px;
  margin-bottom:16px;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input,select{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#2c2c2e;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#1ea9ff,#2f6bff);
  color:#fff;
  font-size:16px;
}
</style>
</head>

<body>

<h2>⛽ 加油紀錄</h2>

<div class="card">

  <div class="row">
    <select id="source">
      <option>中油</option>
      <option>台塑</option>
    </select>

    <select id="type">
      <option value="92">92</option>
      <option value="95" selected>95</option>
      <option value="98">98</option>
      <option value="diesel">柴油</option>
    </select>

    <input id="price" type="number" step="0.1">
  </div>

  <div class="row">
    <input id="amount" placeholder="金額" type="number" inputmode="decimal">
    <input id="km" placeholder="總里程" type="number" inputmode="numeric">
  </div>

  <button onclick="save()">儲存</button>
</div>

<div class="card">
  距離：<span id="distance">-</span> km<br>
  油耗：<span id="kmpl">-</span> km/L
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<script>

let priceMap={
  "中油":{"92":30.2,"95":31.2,"98":33.2,"diesel":28},
  "台塑":{"92":30.0,"95":31.0,"98":33.0,"diesel":27.8}
}

let records=JSON.parse(localStorage.getItem("fuel")||"[]")

function updatePrice(){
  let s=source.value
  let t=type.value
  price.value=priceMap[s][t]
}

source.onchange=updatePrice
type.onchange=updatePrice
updatePrice()

function save(){

  let amount=parseFloat(amountInput.value)
  let km=parseFloat(kmInput.value)
  let priceVal=parseFloat(price.value)

  if(!amount||!km)return alert("請輸入完整")

  let today=new Date().toISOString().slice(0,10)

  let last=records.length?records[records.length-1]:null

  let dist=null
  let kmpl=null

  if(last){
    dist=km-last.km
    let liter=amount/priceVal
    kmpl=dist/liter
  }

  records.push({
    date:today,
    km:km,
    kmpl:kmpl
  })

  localStorage.setItem("fuel",JSON.stringify(records))

  render()
}

function render(){

  if(records.length<2){
    distance.innerText="-"
    kmpl.innerText="-"
  }else{
    let last=records[records.length-1]
    let prev=records[records.length-2]

    let dist=last.km-prev.km
    distance.innerText=dist

    kmpl.innerText=last.kmpl.toFixed(2)
  }

  drawChart()
}

function drawChart(){

  let labels=[]
  let data=[]

  records.forEach(r=>{
    labels.push(r.date.slice(5))
    data.push(r.kmpl||0)
  })

  new Chart(chart,{
    type:"bar",
    data:{
      labels:labels,
      datasets:[{
        label:"km/L",
        data:data
      }]
    }
  })
}

let amountInput=document.getElementById("amount")
let kmInput=document.getElementById("km")
let source=document.getElementById("source")
let type=document.getElementById("type")
let price=document.getElementById("price")
let distance=document.getElementById("distance")
let kmpl=document.getElementById("kmpl")
let chart=document.getElementById("chart")

render()

</script>

</body>
</html>
